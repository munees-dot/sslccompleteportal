  document.getElementById('langBtn').textContent = currentLang === 'en' ? '🌐 മലയാളം' : '🌐 English';
  document.getElementById('pageTitle').textContent = currentLang === 'ml' ? 'ദിവസേനയുള്ള പരീക്ഷ' : 'Daily Exam';
  document.getElementById('pageSub').textContent = currentLang === 'ml' ? 'ജീവശാസ്ത്രം · ക്ലാസ് 10 · സംവേദനങ്ങൾക്കുപിന്നിൽ' : 'Biology · Class 10 · Behind the Senses';
  document.body.setAttribute('data-lang', currentLang);
  document.documentElement.lang = currentLang;
  render();
}

function render(){
  document.getElementById('gateBox').style.display = 'none';
  document.getElementById('startBox').style.display = 'none';
  document.getElementById('quizBox').style.display = 'none';
  document.getElementById('resultBox').style.display = 'none';
  if(quizState === 'gate') renderGate();
  else if(quizState === 'start') renderStart();
  else if(quizState === 'quiz') renderQuiz();
  else renderResult();
}

function renderGate(){
  const t = STR[currentLang];
  const box = document.getElementById('gateBox');
  box.style.display = 'block';
  box.innerHTML = '<div class="gatebox"><b>📌 ' + t.gateTitle + '</b><br>' + t.nowLabel + new Date().toLocaleTimeString('en-GB') + '</div>';
}

function renderStart(){
  const t = STR[currentLang];
  const box = document.getElementById('startBox');
  box.style.display = 'block';
  box.innerHTML =
    '<div class="qstart">' +
    '<p class="qflabel">' + t.admLabel + '</p>' +
    '<input type="text" id="stAdm" inputmode="numeric" autocomplete="off" placeholder="' + t.admPh + '">' +
    '<p class="qerr" id="qerr"></p>' +
    '<button class="btn" id="startBtn" style="width:100%">' + t.startBtn + '</button>' +
    '</div>';
  document.getElementById('startBtn').addEventListener('click', beginExam);
  document.getElementById('stAdm').addEventListener('keydown', function(e){
    if(e.key === 'Enter') beginExam();
  });
}

async function beginExam(){
  const t = STR[currentLang];
  const admVal = document.getElementById('stAdm').value.trim();
  const errEl = document.getElementById('qerr');

  errEl.classList.remove('show');
  if(!admVal){
    errEl.textContent = t.errAdm;
    errEl.classList.add('show');
    return;
  }
  if(!/^\d+$/.test(admVal)){
    errEl.textContent = t.errAdm;
    errEl.classList.add('show');
    return;
  }

  const btn = document.getElementById('startBtn');
  btn.disabled = true;
  btn.textContent = t.checking;

  try {
    const { data, error } = await supabaseClient.rpc('verify_student', {
      p_admission_no: Number(admVal)
    });

    if(error) throw error;

    const student = Array.isArray(data) ? data[0] : data;
    if(!student){
      btn.disabled = false;
      btn.textContent = t.startBtn;
      errEl.textContent = t.invalidAdm;
      errEl.classList.add('show');
      return;
    }

    studentAdmission = String(student.admission_no);
    studentName = student.student_name;
    studentCentre = student.centre || '';
    studentClass = student.class || '';

    score = 0;
    selectedAnswers = new Array(quizData.length).fill(null);
    resultSubmitted = false;
    quizState = 'quiz';
    render();

  } catch (err) {
    console.error(err);
    btn.disabled = false;
    btn.textContent = t.startBtn;
    errEl.textContent = "Database connection error. Please try again.";
    errEl.classList.add('show');
  }
}

function renderQuiz(){
  const t = STR[currentLang];
  const box = document.getElementById('quizBox');
  box.style.display = 'block';
  document.getElementById('scoreLabel').textContent = t.correct + ':';
  document.getElementById('scoreVal').textContent = 0;
  document.getElementById('totalVal').textContent = quizData.length;
  score = 0;

  const container = document.getElementById('quizContainer');
  container.innerHTML = '';

  const who = document.createElement('div');
  who.className = 'qwho';
  who.innerHTML = '<span>' + t.attemptingAs + ' <b>' + escapeHtml(studentName) + '</b> · ' + escapeHtml(studentAdmission) + '</span>';
  container.appendChild(who);

  quizData.forEach(function(item, idx){
    const qText = currentLang === 'ml' ? item.q_ml : item.q;
    const opts = currentLang === 'ml' ? item.opts_ml : item.opts;

    const qDiv = document.createElement('div');
    qDiv.className = 'quiz-q';
    qDiv.innerHTML = '<p><b>' + (idx+1) + '.</b> ' + escapeHtml(qText) + '</p><div class="quiz-opts"></div>';

    const optsDiv = qDiv.querySelector('.quiz-opts');
    opts.forEach(function(opt, oIdx){
      const b = document.createElement('button');
      b.textContent = opt;
      b.addEventListener('click', function(){
        if(b.disabled) return;

        const allBtns = optsDiv.querySelectorAll('button');
        allBtns.forEach(function(x){ x.disabled = true; });

        selectedAnswers[idx] = oIdx;

        if(oIdx === item.ans){
          b.classList.add('correct');
          score++;
        } else {
          b.classList.add('wrong');
          allBtns[item.ans].classList.add('correct');
        }

        document.getElementById('scoreVal').textContent = score;

        if(idx === quizData.length - 1){
          setTimeout(function(){
            quizState = 'result';
            render();
          }, 600);
        }
      });
      optsDiv.appendChild(b);
    });
    container.appendChild(qDiv);
  });
}

async function submitResult(pct){
  const t = STR[currentLang];

  const answers = quizData.map(function(item, idx){
    const selected = selectedAnswers[idx];
    return {
      question_no: idx + 1,
      selected_answer: selected,
      correct_answer: item.ans,
      is_correct: selected === item.ans
    };
  });

  try {
    const { data, error } = await supabaseClient.rpc('submit_quiz', {
      p_admission_no: Number(studentAdmission),
      p_subject: SUBJECT,
      p_chapter: CHAPTER,
      p_quiz_name: QUIZ_NAME,
      p_score: score,
      p_total: quizData.length,
      p_percentage: pct,
      p_answers: answers
    });

    if(error) throw error;

    const result = Array.isArray(data) ? data[0] : data;

    if(result && result.already_submitted){
      return { ok:false, already:true };
    }
    return { ok:true };
  } catch(err) {
    console.error(err);
    return { ok:false, already:false, error:true };
  }
}

function renderResult(){
  const t = STR[currentLang];
  const pct = Math.round(score / quizData.length * 100);
  const msg = pct >= 80 ? t.good : pct >= 50 ? t.mid : t.low;
  const box = document.getElementById('resultBox');
  box.style.display = 'block';

  box.innerHTML =
    '<div class="qwho" style="justify-content:center"><span><b>' + escapeHtml(studentName) + '</b> · ' + escapeHtml(studentAdmission) + ' · ' + escapeHtml(studentCentre) + '</span></div>' +
    '<div class="result-big">' + score + '<span style="font-size:1.3rem;color:#777">/' + quizData.length + '</span></div>' +
    '<div class="result-lbl">' + pct + '% ' + t.correct + '</div>' +
    '<div class="result-msg">' + msg + '</div>' +
    '<div class="qsent" id="qsent">' + t.saving + '</div>' +
    '<button class="btn" id="newStuBtn" style="width:100%;margin-top:14px">' + t.newStudent + '</button>';

  document.getElementById('newStuBtn').addEventListener('click', function(){
    quizState = 'start';
    studentName = '';
    studentCentre = '';
    studentAdmission = '';
    studentClass = '';
    selectedAnswers = [];
    score = 0;
    resultSubmitted = false;
    render();
  });

  if(!resultSubmitted){
    resultSubmitted = true;
    submitResult(pct).then(function(result){
      const el = document.getElementById('qsent');
      if(!el) return;

      if(result.ok){
        el.textContent = '✓ ' + t.saved;
        el.classList.add('ok');
      } else if(result.already){
        el.textContent = '⚠ ' + t.alreadyAttempted;
      } else {
        el.textContent = '⚠ ' + t.saveFail;
      }
    });
  }
}

function escapeHtml(value){
  return String(value ?? '').replace(/[&<>"']/g, function(ch){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
  });
}

function watchGate(){
  const open = isQuizOpen();
  if(_gateOpenSeen === null){ _gateOpenSeen = open; return; }
  if(open !== _gateOpenSeen){
    _gateOpenSeen = open;
    if(open && quizState === 'gate'){ quizState = 'start'; render(); }
    else if(!open){ quizState = 'gate'; render(); }
  }
}

setInterval(watchGate, 15000);
quizState = isQuizOpen() ? 'start' : 'gate';
render();
</script>
