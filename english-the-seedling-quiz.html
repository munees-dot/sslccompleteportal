<script>
/* ---- Daily exam settings ---- */
const QUIZ_OPEN_HOUR = -1;            /* 21 = opens 9 PM (device clock) · -1 = always open */
const SUBJECT   = "English";
const CHAPTER   = "The Seedling";
const QUIZ_NAME = "The Seedling | English Unit 2";
const SUPABASE_URL = "https://wrzssivgxituefcwobbr.supabase.co";
const SUPABASE_KEY = "sb_publishable_3mi5iJCxekZfiyXojUFtQg_gDASyEWm";
let sb = null;
try{ sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); }catch(e){ console.error(e); }
let student = null;

const quizData = [
  { q: "1. Who wrote the poem 'The Seedling'?",
    options: ["Edgar A. Guest", "Paul Laurence Dunbar", "William Wordsworth", "Robert Frost"], answer: 1 },
  { q: "2. Where was the seedling lying at the beginning of the poem?",
    options: ["In a flower pot", "In its darksome bed", "On a rock", "In a river"], answer: 1 },
  { q: "3. What did the seedling say about itself?",
    options: ["It was the strongest plant", "It was not so very robust", "It was afraid of the sun", "It wanted to sleep"], answer: 1 },
  { q: "4. What did the seedling promise to do?",
    options: ["Grow faster than others", "Do the best it can", "Wait for the rain", "Stay underground"], answer: 1 },
  { q: "5. What did the seedling push up first into the light of day?",
    options: ["A flower", "A root", "A little leaflet", "A stem"], answer: 2 },
  { q: "6. Why did the leaflet come out?",
    options: ["To drink rain", "To examine the surroundings and show the rest the way", "To find the sun", "To escape insects"], answer: 1 },
  { q: "7. Whom did the leaflet call after it liked the prospect?",
    options: ["Its sister, Root", "Its brother, Stem", "The Sun", "The Clouds"], answer: 1 },
  { q: "8. How many other leaflets followed?",
    options: ["One", "Two", "Three", "Four"], answer: 1 },
  { q: "9. What did the haste and hurry make the seedling do?",
    options: ["Sleep and dream", "Sweat and pant", "Cry and weep", "Stop and rest"], answer: 1 },
  { q: "10. What helped the little plant to keep growing?",
    options: ["Wind and snow", "Sunshine and showers", "Moon and stars", "Soil and stones"], answer: 1 },
  { q: "11. What did the plant finally become?",
    options: ["A tree", "A fruit", "A flower", "A seed"], answer: 2 },
  { q: "12. Whom does the poet address as 'Little folks'?",
    options: ["Farmers", "Children", "Plants", "Birds"], answer: 1 },
  { q: "13. According to the poet, every child must share —",
    options: ["life's pleasures", "life's labour", "life's riches", "life's sorrows"], answer: 1 },
  { q: "14. What kind of hours will the sun and showers help us through?",
    options: ["Happy, joyful hours", "Lonesome, struggling hours", "Busy, noisy hours", "Early morning hours"], answer: 1 },
  { q: "15. What are 'Virtue's fair, unfading flowers'?",
    options: ["Real flowers in a garden", "Good qualities that last forever", "Flowers that bloom at night", "Plastic flowers"], answer: 1 },
  { q: "16. What is the rhyme scheme of the poem?",
    options: ["aabb", "abab", "abcb", "abba"], answer: 2 },
  { q: "17. 'The leaflet liked the prospect' is an example of —",
    options: ["Simile", "Personification", "Hyperbole", "Onomatopoeia"], answer: 1 },
  { q: "18. 'Haste and hurry' is an example of —",
    options: ["Alliteration", "Metaphor", "Irony", "Oxymoron"], answer: 0 },
  { q: "19. What is the tone of the poem?",
    options: ["Sad and gloomy", "Angry", "Optimistic and encouraging", "Humorous and mocking"], answer: 2 },
  { q: "20. What was the title of Dunbar's first book of poems?",
    options: ["Leaves of Grass", "Oak and Ivy", "The Tatler", "Our Martyred Soldiers"], answer: 1 }
];

let currentQ = 0;
const userAnswers = new Array(quizData.length).fill(null);

const progressEl = document.getElementById('quiz-progress');
const qWrap = document.getElementById('quiz-question-wrap');
const prevBtn = document.getElementById('quiz-prev');
const nextBtn = document.getElementById('quiz-next');
const activeBlock = document.getElementById('quiz-active');
const finalBlock = document.getElementById('quiz-final');

const pageUrl = window.location.origin + window.location.pathname;
const portalUrl = pageUrl.replace('english-the-seedling-quiz.html', 'english-the-seedling.html');

function stripNum(q){ return q.replace(/^\d+\.\s*/, ''); }

function buildProgress(){
  progressEl.innerHTML = '';
  quizData.forEach((_, i)=>{
    const dot = document.createElement('div');
    dot.className = 'quiz-dot';
    dot.id = `dot-${i}`;
    dot.style.cursor = 'pointer';
    dot.title = `Question ${i+1}`;
    dot.addEventListener('click', ()=>{ currentQ = i; renderQuestion(); });
    progressEl.appendChild(dot);
  });
}

function updateProgress(){
  quizData.forEach((_, i)=>{
    const dot = document.getElementById(`dot-${i}`);
    dot.classList.remove('active','done');
    if(i === currentQ) dot.classList.add('active');
    else if(userAnswers[i] !== null) dot.classList.add('done');
  });
}

function renderQuestion(){
  const item = quizData[currentQ];
  document.getElementById('q-counter').textContent = `Question ${currentQ+1} of ${quizData.length}`;
  const optsHtml = item.options.map((opt, j)=>{
    const checked = userAnswers[currentQ] === j ? 'checked' : '';
    return `<label><input type="radio" name="qcurrent" value="${j}" ${checked}> ${opt}</label>`;
  }).join('');
  qWrap.innerHTML = `<div><strong>${item.q}</strong></div><div class="quiz-options">${optsHtml}</div>`;

  qWrap.querySelectorAll('input[name="qcurrent"]').forEach(input=>{
    input.addEventListener('change', (e)=>{
      userAnswers[currentQ] = parseInt(e.target.value);
      updateProgress();
    });
  });

  prevBtn.disabled = currentQ === 0;
  nextBtn.textContent = currentQ === quizData.length - 1 ? 'Finish' : 'Next';
  updateProgress();
}

prevBtn.addEventListener('click', ()=>{
  if(currentQ > 0){ currentQ--; renderQuestion(); }
});

nextBtn.addEventListener('click', ()=>{
  if(currentQ < quizData.length - 1){
    currentQ++;
    renderQuestion();
  } else {
    const unanswered = userAnswers.filter(a => a === null).length;
    if(unanswered > 0 && !confirm(`You have ${unanswered} unanswered question(s). Finish anyway?`)) return;
    finishQuiz();
  }
});

function finishQuiz(){
  let score = 0;
  quizData.forEach((item, i)=>{ if(userAnswers[i] === item.answer) score++; });
  activeBlock.style.display = 'none';
  progressEl.style.display = 'none';
  document.getElementById('name-row').style.display = 'none';
  finalBlock.style.display = 'block';

  const name = (student ? student.name : '');
  const pct = Math.round(score / quizData.length * 100);
  document.getElementById('score-big').textContent = `${score}/${quizData.length}`;
  document.getElementById('score-line').textContent = (name ? name + ', you' : 'You') + ` scored ${pct}%`;
  document.getElementById('score-msg').textContent =
    pct >= 90 ? 'Outstanding! Like the seedling, you have bloomed into a flower.' :
    pct >= 70 ? 'Very good! Keep growing — a little more effort and you will bloom.' :
    pct >= 50 ? 'Good try! Revise the poem once more and do the best you can.' :
                'Don\'t give up! "I\'ll do the best I can" — read the poem again and retake the quiz.';
  document.getElementById('share-fallback').innerHTML = '';
  document.getElementById('quiz-share').dataset.score = score;
  saveResult(score);

  const list = document.getElementById('review-list');
  list.innerHTML = quizData.map((item, i)=>{
    const ua = userAnswers[i];
    const correct = item.options[item.answer];
    let status;
    if(ua === null) status = `<div class="r-skip">✗ Not answered · Correct: <strong>${correct}</strong></div>`;
    else if(ua === item.answer) status = `<div class="r-ok">✓ ${correct}</div>`;
    else status = `<div class="r-bad">✗ Your answer: ${item.options[ua]}</div><div class="r-ok">Correct: <strong>${correct}</strong></div>`;
    return `<div class="review-item"><div class="review-q">${i+1}. ${stripNum(item.q)}</div>${status}</div>`;
  }).join('');
  document.getElementById('review-card').style.display = 'block';
  window.scrollTo({top:0, behavior:'smooth'});
}

document.getElementById('quiz-restart').addEventListener('click', ()=>{
  currentQ = 0;
  userAnswers.fill(null);
  student = null; foundStu = null; blocked = false;
  admInput.value = ''; stuInfo.innerHTML = ''; startBtn.disabled = true;
  activeBlock.style.display = 'none';
  progressEl.style.display = 'none';
  document.getElementById('name-row').style.display = 'block';
  finalBlock.style.display = 'none';
  document.getElementById('review-card').style.display = 'none';
  document.getElementById('share-fallback').innerHTML = '';
  renderQuestion();
});

async function shareOrCopy(data, fallbackEl, copiedMsg){
  if(navigator.share){
    try{ await navigator.share(data); return; }catch(err){ if(err && err.name === 'AbortError') return; }
  }
  const full = `${data.text}\n${data.url}`;
  try{
    await navigator.clipboard.writeText(full);
    fallbackEl.innerHTML = `${copiedMsg}<br><textarea readonly>${full}</textarea>`;
  }catch(err){
    fallbackEl.innerHTML = `<textarea readonly>${full}</textarea>`;
  }
}

document.getElementById('quiz-share').addEventListener('click', ()=>{
  const score = document.getElementById('quiz-share').dataset.score;
  const name = (student ? student.name : '');
  const who = name ? `${name} scored` : 'I scored';
  shareOrCopy(
    { title: 'The Seedling Quiz Result', text: `${who} ${score}/${quizData.length} on "The Seedling" quiz! Try it yourself.`, url: pageUrl },
    document.getElementById('share-fallback'),
    'Result copied to clipboard! You can paste it anywhere.'
  );
});

document.getElementById('quiz-invite-share').addEventListener('click', ()=>{
  shareOrCopy(
    { title: 'The Seedling Quiz', text: 'Take this quiz on "The Seedling" (Class X English, Unit 2) and test what you know!', url: pageUrl },
    document.getElementById('quiz-invite-fallback'),
    'Quiz link copied! Paste it to invite others.'
  );
});

document.querySelector('.back-link').href = portalUrl;

/* ---- Admission number lookup ---- */
const admInput = document.getElementById('adm-no');
const stuInfo  = document.getElementById('stu-info');
const startBtn = document.getElementById('start-btn');
let foundStu = null, blocked = false, seq = 0, lookTimer = null;

function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showStudent(){
  const s = foundStu;
  const meta = [s.adm, s.cls ? 'Class '+s.cls : '', s.centre].filter(Boolean).map(esc).join(' · ');
  stuInfo.innerHTML = `<div class="stu-card"><div class="stu-av">${esc((s.name||'?').trim().charAt(0).toUpperCase())}</div><div><b>${esc(s.name)}</b><span>${meta}</span></div></div>` +
    (blocked ? `<div class="stu-warn">You have already written this quiz today. Only one attempt is allowed.</div>` : '');
  startBtn.disabled = blocked;
}
admInput.addEventListener('input', ()=>{
  const v = admInput.value.replace(/\D/g,''); if(v !== admInput.value) admInput.value = v;
  foundStu = null; blocked = false; startBtn.disabled = true; clearTimeout(lookTimer); const my = ++seq;
  if(!v){ stuInfo.innerHTML = ''; return; }
  if(!sb){ stuInfo.innerHTML = '<div class="stu-msg bad">Could not connect. Check your internet and reload the page.</div>'; return; }
  stuInfo.innerHTML = '<div class="stu-msg">Searching…</div>';
  lookTimer = setTimeout(async ()=>{
    try{
      const { data, error } = await sb.rpc('verify_student', { p_admission_no: Number(v) });
      if(my !== seq) return;
      if(error) throw error;
      const s = Array.isArray(data) ? data[0] : data;
      if(!s){ stuInfo.innerHTML = '<div class="stu-msg bad">No student found with this number. Please check.</div>'; return; }
      foundStu = { adm:String(s.admission_no ?? v), name:s.student_name || '', cls:s['class'] || '', centre:s.centre || '' };
      showStudent(); startBtn.disabled = true;
      try{
        const r = await sb.rpc('has_attempted', { p_admission_no: Number(foundStu.adm), p_quiz_name: QUIZ_NAME });
        if(my !== seq) return;
        let d = r && r.data; if(Array.isArray(d)) d = d[0]; if(d && typeof d === 'object') d = d.has_attempted;
        blocked = (!r.error && d === true);
      }catch(e){ /* optional check not installed */ }
      if(my === seq) showStudent();
    }catch(err){
      console.error(err);
      if(my === seq) stuInfo.innerHTML = '<div class="stu-msg bad">Could not connect. Check your internet and try again.</div>';
    }
  }, 450);
});
admInput.addEventListener('keydown', e=>{ if(e.key === 'Enter' && !startBtn.disabled) startBtn.click(); });
startBtn.addEventListener('click', ()=>{
  if(!foundStu || blocked) return;
  student = foundStu;
  document.getElementById('name-row').style.display = 'none';
  progressEl.style.display = 'flex';
  activeBlock.style.display = 'block';
  currentQ = 0; userAnswers.fill(null);
  renderQuestion();
});

/* ---- Save score to Supabase ---- */
async function saveResult(score){
  const el = document.getElementById('save-status');
  el.className = 'save-status'; el.textContent = 'Saving your score…';
  const answers = quizData.map((item, i)=>({ question_no:i+1, selected_answer:userAnswers[i], correct_answer:item.answer, is_correct:userAnswers[i] === item.answer }));
  try{
    const { data, error } = await sb.rpc('submit_quiz', {
      p_admission_no: Number(student.adm), p_subject: SUBJECT, p_chapter: CHAPTER, p_quiz_name: QUIZ_NAME,
      p_score: score, p_total: quizData.length, p_percentage: Math.round(score / quizData.length * 100), p_answers: answers
    });
    if(error) throw error;
    const r = Array.isArray(data) ? data[0] : data;
    if(r && r.already_submitted){ el.className = 'save-status bad'; el.textContent = '⚠ A result for this admission number already exists today — this attempt was not saved.'; }
    else { el.className = 'save-status ok'; el.textContent = '✓ Score saved'; }
  }catch(err){
    console.error(err);
    el.className = 'save-status bad';
    el.innerHTML = '⚠ Could not save the score. <button type="button" id="save-retry">Try again</button>';
    document.getElementById('save-retry').addEventListener('click', ()=>saveResult(score));
  }
}

/* ---- Time gate ---- */
const gateBox = document.getElementById('gate-box');
function isOpen(){ return QUIZ_OPEN_HOUR < 0 || new Date().getHours() >= QUIZ_OPEN_HOUR; }
function fmtHour(h){ return ((h % 12) || 12) + ':00 ' + (h >= 12 ? 'PM' : 'AM'); }
function applyGate(){
  const open = isOpen();
  if(!open && !student){
    document.getElementById('name-row').style.display = 'none';
    gateBox.style.display = 'block';
    gateBox.innerHTML = `<div class="gt">Today's quiz opens at ${fmtHour(QUIZ_OPEN_HOUR)}</div><div class="stu-msg">Current time</div><div class="gc">${new Date().toLocaleTimeString('en-IN')}</div>`;
  } else if(gateBox.style.display !== 'none'){
    gateBox.style.display = 'none';
    if(!student) document.getElementById('name-row').style.display = 'block';
  }
}
setInterval(applyGate, 1000);

buildProgress();
applyGate();
</script>
