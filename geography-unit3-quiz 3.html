function lookup(v,my){
  sb.rpc("verify_student",{p_admission_no:Number(v)}).then(function(res){
    if(my!==seq) return;
    var who=document.getElementById("who"); if(!who) return;
    if(res.error){ console.error(res.error); who.innerHTML='<div class="e">'+t("dbErr")+'</div>'; return; }
    var s=Array.isArray(res.data)?res.data[0]:res.data;
    if(!s){ who.innerHTML='<div class="e">'+t("notFound")+'</div>'; return; }
    found={adm:String(s.admission_no!=null?s.admission_no:v),name:s.student_name||"",cls:s["class"]||"",centre:s.centre||""};
    blocked=false;
    var go=document.getElementById("go");
    who.innerHTML=stuCard(found); go.disabled=true;
    if(CFG.preview){ showFound(); return; }
    sb.rpc("has_attempted",{p_admission_no:Number(found.adm),p_quiz_name:CFG.quizName}).then(function(r){
      if(my!==seq) return;
      var d=r&&r.data; if(Array.isArray(d)) d=d[0];
      if(d&&typeof d==="object") d=d.has_attempted;
      blocked=(!r.error && d===true);
      showFound();
    },function(){ if(my===seq) showFound(); });
  },function(err){ console.error(err); if(my!==seq) return; var who=document.getElementById("who"); if(who) who.innerHTML='<div class="e">'+t("dbErr")+'</div>'; });
}

function begin(){
  order=QUIZ.map(function(_,i){return i;});
  if(CFG.shuffle){ for(var i=order.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var x=order[i]; order[i]=order[j]; order[j]=x; } }
  picks=QUIZ.map(function(){return null;});
  cur=0; saveState=null; view="quiz"; render(); window.scrollTo(0,0);
}

function optsHtml(qi){
  var q=QUIZ[qi], p=picks[qi], h="";
  for(var o=0;o<q.opts.length;o++){
    var cls="opt";
    if(p!==null){ if(o===q.ans) cls+=" ok"; else if(o===p) cls+=" no"; }
    h+='<button class="'+cls+'" data-qi="'+qi+'" data-oi="'+o+'"'+(p!==null?" disabled":"")+'><span class="k">'+KEYS[o]+'</span><span>'+esc(oText(q,o))+'</span></button>';
  }
  if(p!==null && eText(q)) h+='<div class="exp">💡 '+esc(eText(q))+'</div>';
  return h;
}
function stripHtml(){
  var a=answeredCount();
  return '<div class="strip"><span class="chip">'+esc(stu.name)+' · '+esc(stu.adm)+'</span><span>'+t("score")+': <b id="sc">'+score()+'</b> / '+QUIZ.length+'</span></div>'+
    '<div class="bar"><i id="bar" style="width:'+Math.round(a/QUIZ.length*100)+'%"></i></div>';
}
function quiz(){
  var h='<div class="card">'+stripHtml();
  if(CFG.layout==="all"){
    order.forEach(function(qi,n){
      h+='<div class="qb" id="qb'+qi+'"><div class="qn">'+t("q")+' '+(n+1)+'</div><div class="qt">'+esc(qText(QUIZ[qi]))+'</div><div class="os">'+optsHtml(qi)+'</div></div>';
    });
    var left=QUIZ.length-answeredCount();
    h+='<button class="btn" id="fin"'+(left?" disabled":"")+'>'+t("submit")+'</button><div class="left" id="left">'+(left?left+t("left"):"")+'</div>';
  } else {
    var qi=order[cur];
    h+='<div class="qn">'+t("q")+' '+(cur+1)+' '+t("of")+' '+QUIZ.length+'</div><div class="qt">'+esc(qText(QUIZ[qi]))+'</div><div class="os" id="qb'+qi+'">'+optsHtml(qi)+'</div>';
    var last=cur===order.length-1;
    h+='<div class="btns">'+(cur>0?'<button class="btn alt" id="prv">'+t("prev")+'</button>':"")+
      '<button class="btn" id="nxt"'+(picks[qi]===null?" disabled":"")+'>'+(last?t("finish"):t("next"))+'</button></div>';
  }
  h+='</div>';
  app.innerHTML=h;
  var prv=document.getElementById("prv"), nxt=document.getElementById("nxt"), fin=document.getElementById("fin");
  if(prv) prv.addEventListener("click",function(){ cur--; render(); });
  if(nxt) nxt.addEventListener("click",function(){ if(cur<order.length-1){ cur++; render(); window.scrollTo(0,0); } else finish(); });
  if(fin) fin.addEventListener("click",finish);
}
app.addEventListener("click",function(e){
  var b=e.target.closest?e.target.closest(".opt"):null;
  if(!b||b.disabled||view!=="quiz") return;
  var qi=+b.getAttribute("data-qi"), oi=+b.getAttribute("data-oi");
  if(picks[qi]!==null) return;
  picks[qi]=oi;
  var box=document.getElementById("qb"+qi);
  if(box){ var os=box.classList.contains("os")?box:box.querySelector(".os"); os.innerHTML=optsHtml(qi); }
  document.getElementById("sc").textContent=score();
  var a=answeredCount(); document.getElementById("bar").style.width=Math.round(a/QUIZ.length*100)+"%";
  var nxt=document.getElementById("nxt"); if(nxt) nxt.disabled=false;
  var fin=document.getElementById("fin"), left=document.getElementById("left");
  if(fin){ var l=QUIZ.length-a; fin.disabled=l>0; left.textContent=l?l+t("left"):""; }
});

function finish(){ view="result"; render(); window.scrollTo(0,0); save(); }

function saveHtml(){
  if(saveState==="ok") return '<div class="save ok" id="sv">'+t("saved")+'</div>';
  if(saveState==="dup") return '<div class="save bad" id="sv">'+t("dup")+'</div>';
  if(saveState==="fail") return '<div class="save bad" id="sv">'+t("fail")+'<button id="rt">'+t("retry")+'</button></div>';
  if(saveState==="off") return '<div class="save" id="sv">'+t("off")+'</div>';
  if(saveState==="pv") return '<div class="save" id="sv">'+t("pv")+'</div>';
  return '<div class="save" id="sv">'+t("saving")+'</div>';
}
function paintSave(){
  var el=document.getElementById("sv"); if(!el) return;
  el.outerHTML=saveHtml();
  var rt=document.getElementById("rt"); if(rt) rt.addEventListener("click",function(){ saveState=null; paintSave(); save(true); });
}
function result(){
  var s=score(), n=QUIZ.length, pct=Math.round(s/n*100);
  var msg=pct>=80?t("good"):pct>=50?t("mid"):t("low");
  var h='<div class="card"><div class="rwho">'+esc(stu.name)+' · '+esc(stu.adm)+(stu.centre?' · '+esc(stu.centre):"")+'</div>'+
    '<div class="ring" style="background:conic-gradient(var(--ac) '+(pct*3.6)+'deg,var(--line) 0)"><div><b>'+s+'</b><span>/ '+n+' · '+pct+'%</span></div></div>'+
    '<div class="rmsg">'+msg+'</div>'+saveHtml();
  var wrong=order.filter(function(qi){ return picks[qi]!==QUIZ[qi].ans; });
  h+='<div class="rv"><h3>'+(wrong.length?t("review"):t("perfect"))+'</h3>';
  wrong.forEach(function(qi){
    var q=QUIZ[qi];
    h+='<div class="rvi"><p>'+esc(qText(q))+'</p><div class="y">✗ '+t("yours")+esc(picks[qi]===null?"—":oText(q,picks[qi]))+'</div><div class="c">✓ '+t("right")+esc(oText(q,q.ans))+'</div>'+(eText(q)?'<div class="x">💡 '+esc(eText(q))+'</div>':'')+'</div>';
  });
  h+='</div><div class="btns"><button class="btn alt" id="ns">'+t("nextStu")+'</button></div></div>';
  app.innerHTML=h;
  var rt=document.getElementById("rt"); if(rt) rt.addEventListener("click",function(){ saveState=null; paintSave(); save(true); });
  document.getElementById("ns").addEventListener("click",function(){ stu=null; found=null; blocked=false; admVal=""; nameVal=""; picks=[]; saveState=null; view=isOpen()?"start":"gate"; render(); });
}

function save(force){
  if(saveState!==null && !force) return;
  if(CFG.preview){ saveState="pv"; paintSave(); return; }
  if(!sb){ saveState="off"; paintSave(); return; }
  saveState="saving";
  var s=score(), n=QUIZ.length;
  var answers=QUIZ.map(function(q,i){ return {question_no:i+1,selected_answer:picks[i],correct_answer:q.ans,is_correct:picks[i]===q.ans}; });
  sb.rpc("submit_quiz",{p_admission_no:Number(stu.adm),p_subject:CFG.subject,p_chapter:CFG.chapter,p_quiz_name:CFG.quizName,p_score:s,p_total:n,p_percentage:Math.round(s/n*100),p_answers:answers}).then(function(res){
    if(res.error){ console.error(res.error); saveState="fail"; }
    else { var d=Array.isArray(res.data)?res.data[0]:res.data; saveState=(d&&d.already_submitted)?"dup":"ok"; }
    paintSave();
  },function(err){ console.error(err); saveState="fail"; paintSave(); });
}

document.getElementById("langBtn").addEventListener("click",function(){ lang=lang==="en"?"ml":"en"; render(); });
setInterval(function(){
  if(view==="gate" && isOpen()){ view="start"; render(); }
  else if(view==="start" && !isOpen()){ view="gate"; render(); }
},15000);
view=isOpen()?"start":"gate";
render();
})();
</script>
