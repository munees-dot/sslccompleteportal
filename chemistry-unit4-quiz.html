    '<p class="qflabel">' + t.admLabel + '</p>' +
    '<input type="text" id="stAdm" inputmode="numeric" placeholder="' + t.admPh + '" value="' + studentAdmission.replace(/"/g,'&quot;') + '">' +
    '<p class="qerr" id="qerr"></p>' +
    '<button class="btn" id="startBtn" style="width:100%">' + t.startBtn + '</button>' +
    '</div>';
  document.getElementById('startBtn').addEventListener('click', beginExam);
}

const ATTEMPT_KEY = 'chemExamAttempts_v1';
function todayStr(){ return new Date().toLocaleDateString('en-GB'); }
function getAttempts(){ try{ return JSON.parse(localStorage.getItem(ATTEMPT_KEY) || '{}'); }catch(e){ return {}; } }
function markAttempted(adm){
  const map = getAttempts(); const d = todayStr();
  if(!map[d]) map[d] = [];
  if(map[d].indexOf(adm) === -1) map[d].push(adm);
  try{ localStorage.setItem(ATTEMPT_KEY, JSON.stringify(map)); }catch(e){}
}
function isAttemptedOnThisDevice(adm){
  const map = getAttempts(); const d = todayStr();
  return !!(map[d] && map[d].indexOf(adm) !== -1);
}
function checkAlreadyAttemptedOnServer(adm){
  if(!SCRIPT_URL) return Promise.resolve(false);
  const url = SCRIPT_URL + (SCRIPT_URL.indexOf('?') === -1 ? '?' : '&') +
    'admissionNumber=' + encodeURIComponent(adm) + '&date=' + encodeURIComponent(todayStr());
  const ctrl = ('AbortController' in window) ? new AbortController() : null;
  const opts = ctrl ? {signal: ctrl.signal} : {};
  const timeout = new Promise(res => setTimeout(function(){ if(ctrl) ctrl.abort(); res(null); }, 4000));
  const req = fetch(url, opts).then(function(r){ return r.json(); }).then(function(d){ return !!d.taken; }).catch(function(){ return null; });
  return Promise.race([req, timeout]).then(function(r){ return r === true; });
}

function beginExam(){
  const t = STR[currentLang];
  const nameVal = document.getElementById('stName').value.trim();
  const centreVal = document.getElementById('stCentre').value;
  const admVal = document.getElementById('stAdm').value.trim();
  const errEl = document.getElementById('qerr');
  if(!nameVal || !centreVal || !admVal){ errEl.textContent = t.errFields; errEl.classList.add('show'); return; }

  if(isAttemptedOnThisDevice(admVal)){
    errEl.textContent = t.alreadyAttempted; errEl.classList.add('show'); return;
  }

  const btn = document.getElementById('startBtn');
  btn.disabled = true; btn.textContent = t.checking;
  errEl.classList.remove('show');

  checkAlreadyAttemptedOnServer(admVal).then(function(taken){
    if(taken){
      btn.disabled = false; btn.textContent = t.startBtn;
      errEl.textContent = t.alreadyAttempted; errEl.classList.add('show');
      return;
    }
    studentName = nameVal; studentCentre = centreVal; studentAdmission = admVal;
    score = 0; resultSubmitted = false;
    quizState = 'quiz';
    render();
  });
}

function renderQuiz(){
  const t = STR[currentLang];
  const box = document.getElementById('quizBox');
  box.style.display = 'block';
  document.getElementById('scoreLabel').textContent = t.score;
  document.getElementById('scoreVal').textContent = 0;
  document.getElementById('totalVal').textContent = quizData.length;
  score = 0;
  const container = document.getElementById('quizContainer');
  container.innerHTML = '';
  const who = document.createElement('div');
  who.className = 'qwho';
  who.innerHTML = '<span>' + t.attemptedAs + ' <b>' + studentName + '</b> · ' + studentAdmission + '</span>';
  container.appendChild(who);
  quizData.forEach(function(item, idx){
    const qText = currentLang === 'ml' ? item.q_ml : item.q;
    const opts = currentLang === 'ml' ? item.opts_ml : item.opts;
    const qDiv = document.createElement('div');
    qDiv.className = 'quiz-q';
    qDiv.innerHTML = '<p><b>' + (idx+1) + '.</b> ' + qText + '</p><div class="quiz-opts"></div>';
    const optsDiv = qDiv.querySelector('.quiz-opts');
    opts.forEach(function(opt, oIdx){
      const b = document.createElement('button');
      b.textContent = opt;
      b.addEventListener('click', function(){
        if(b.disabled) return;
        const allBtns = optsDiv.querySelectorAll('button');
        allBtns.forEach(function(x){ x.disabled = true; });
        if(oIdx === item.ans){
          b.classList.add('correct');
          score++;
        } else {
          b.classList.add('wrong');
          allBtns[item.ans].classList.add('correct');
        }
        document.getElementById('scoreVal').textContent = score;
        if(idx === quizData.length - 1){
          setTimeout(function(){ quizState = 'result'; render(); }, 600);
        }
      });
      optsDiv.appendChild(b);
    });
    container.appendChild(qDiv);
  });
}

const PENDING_KEY = 'chemExamPending_v1';
function getPending(){ try{ return JSON.parse(localStorage.getItem(PENDING_KEY) || '[]'); }catch(e){ return []; } }
function setPending(arr){ try{ localStorage.setItem(PENDING_KEY, JSON.stringify(arr)); }catch(e){} }
function queuePending(fd){ const arr = getPending(); arr.push(fd); setPending(arr); }
function removePending(fd){ setPending(getPending().filter(function(p){ return p._id !== fd._id; })); }
function sendToSheet(fd){
  return fetch(SCRIPT_URL, {
    method: 'POST', mode: 'no-cors',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify(fd)
  });
}
let currentSubmitId = null;
function trySend(fd, attempt){
  attempt = attempt || 0;
  sendToSheet(fd).then(function(){
    removePending(fd);
    if(fd._id === currentSubmitId){ const el = document.getElementById('qsent'); if(el){ el.textContent = '✓ ' + STR[currentLang].sentOk; el.classList.add('ok'); } }
  }).catch(function(){
    if(attempt < 3){ setTimeout(function(){ trySend(fd, attempt + 1); }, 2500 * (attempt + 1)); }
    else if(fd._id === currentSubmitId){ const el = document.getElementById('qsent'); if(el){ el.textContent = '⚠ ' + STR[currentLang].sentFail; } }
  });
}
function flushPending(){
  if(!SCRIPT_URL) return;
  getPending().forEach(function(p){ trySend(p); });
}
function submitResult(pct){
  if(!SCRIPT_URL) return;
  const now = new Date();
  const fd = {
    _id: Date.now() + '-' + Math.random().toString(36).slice(2),
    name: studentName, centre: studentCentre, admissionNumber: studentAdmission,
    chapter: CHAPTER_TITLE, score: score, total: quizData.length, percent: pct,
    date: now.toLocaleDateString('en-GB'), time: now.toLocaleTimeString('en-GB')
  };
  currentSubmitId = fd._id;
  queuePending(fd);
  trySend(fd);
}

function renderResult(){
  const t = STR[currentLang];
  const pct = Math.round(score / quizData.length * 100);
  const msg = pct >= 80 ? t.good : pct >= 50 ? t.mid : t.low;
  const box = document.getElementById('resultBox');
  box.style.display = 'block';
  box.innerHTML =
    '<div class="qwho" style="justify-content:center"><span><b>' + studentName + '</b> · ' + studentAdmission + ' · ' + studentCentre + '</span></div>' +
    '<div class="result-big">' + score + '<span style="font-size:1.3rem;color:#777">/' + quizData.length + '</span></div>' +
    '<div class="result-lbl">' + pct + '% ' + t.correct + '</div>' +
    '<div class="result-msg">' + msg + '</div>' +
    '<div class="qsent" id="qsent">' + t.sending + '</div>' +
    '<button class="btn" id="newStuBtn" style="width:100%;margin-top:14px">' + t.newStudent + '</button>';
  document.getElementById('newStuBtn').addEventListener('click', function(){
    quizState = 'start'; studentName = ''; studentCentre = ''; studentAdmission = ''; score = 0;
    render();
  });
  if(!resultSubmitted){
    resultSubmitted = true;
    markAttempted(studentAdmission);
    submitResult(pct);
  } else {
    const el = document.getElementById('qsent');
    if(el){ el.textContent = t.sentAlready; el.classList.add('ok'); }
  }
}

function watchGate(){
  const open = isQuizOpen();
  if(_gateOpenSeen === null){ _gateOpenSeen = open; return; }
  if(open !== _gateOpenSeen){
    _gateOpenSeen = open;
    if(open && quizState === 'gate'){ quizState = 'start'; render(); }
    else if(!open){ quizState = 'gate'; render(); }
  }
}
setInterval(watchGate, 15000);

flushPending();
quizState = isQuizOpen() ? 'start' : 'gate';
render();
</script>
