<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mathematics of Chances – Class X Maths | Abacus Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c2541; --muted:#5b6784; --bg:#f4f7fc; --card:#ffffff; --line:#dfe6f2;
  --brand:#1f4fd8; --brand2:#0e2a8a; --accent:#ff7a1a; --green:#16a34a; --red:#dc2626;
  --soft:#eaf0ff; --pink:#fde7f1; --mint:#e4f8ee; --sun:#fff4d6;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Noto Sans Malayalam','Poppins',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.75;font-size:16px}
body.lang-ml .en{display:none}
body.lang-en .ml{display:none}
/* header */
header{background:linear-gradient(120deg,var(--brand2),var(--brand) 60%,#3b82f6);color:#fff;position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(14,42,138,.35)}
.hwrap{max-width:1100px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:'Poppins',sans-serif;font-weight:700;letter-spacing:.5px;background:#fff;color:var(--brand2);padding:4px 12px;border-radius:8px;font-size:14px;white-space:nowrap}
.htitle{flex:1;min-width:200px}
.htitle b{display:block;font-size:17px;line-height:1.3}
.htitle small{opacity:.85;font-family:'Poppins',sans-serif;font-size:12px}
.langbtn{display:flex;border:1.5px solid rgba(255,255,255,.7);border-radius:20px;overflow:hidden;font-family:'Poppins',sans-serif;font-size:13px}
.langbtn button{background:transparent;color:#fff;border:0;padding:6px 14px;cursor:pointer;font:inherit}
body.lang-ml .langbtn .bml, body.lang-en .langbtn .ben{background:#fff;color:var(--brand2);font-weight:600}
nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:62px;z-index:40}
.navwrap{max-width:1100px;margin:auto;display:flex;overflow-x:auto;gap:4px;padding:6px 12px;scrollbar-width:thin}
nav button{font-family:'Poppins',sans-serif;border:0;background:transparent;padding:9px 16px;border-radius:20px;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:500}
nav button.on{background:var(--brand);color:#fff}
nav button:hover:not(.on){background:var(--soft)}
main{max-width:1100px;margin:auto;padding:18px 16px 60px}
.panel{display:none}.panel.on{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
h2{font-size:24px;margin:8px 0 10px;color:var(--brand2);line-height:1.35}
h3{font-size:19px;margin:0 0 8px;color:var(--brand2);line-height:1.4}
h4{margin:10px 0 4px;font-size:16px;color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin:14px 0;box-shadow:0 2px 8px rgba(30,60,120,.05)}
.hero{background:linear-gradient(135deg,#e7f0ff,#fde9f3);border:0;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.hero .big{font-family:'Poppins',sans-serif;font-size:64px;font-weight:700;color:var(--brand);line-height:1;background:#fff;border-radius:18px;padding:12px 22px;box-shadow:0 4px 14px rgba(31,79,216,.2)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.mini{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.mini .ico{font-size:26px}
.tag{display:inline-block;font-family:'Poppins',sans-serif;font-size:12px;padding:2px 10px;border-radius:12px;background:var(--soft);color:var(--brand2);font-weight:600;margin-right:6px}
.tag.o{background:#ffe9d6;color:#9a4300}
.key{background:var(--sun);border-left:5px solid var(--accent);padding:10px 14px;border-radius:10px;margin:10px 0}
.note{background:var(--mint);border-left:5px solid var(--green);padding:10px 14px;border-radius:10px;margin:10px 0}
.warn{background:var(--pink);border-left:5px solid #e0368b;padding:10px 14px;border-radius:10px;margin:10px 0}
.formula{background:var(--soft);border:1.5px dashed var(--brand);border-radius:12px;padding:12px;text-align:center;font-size:19px;margin:10px 0}
table.t{border-collapse:collapse;margin:10px 0;font-size:15px;max-width:100%}
table.t th,table.t td{border:1px solid #b9c6e0;padding:6px 12px;text-align:center}
table.t th{background:var(--soft)}
.scroll{overflow-x:auto}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;margin:0 2px;font-family:'Poppins',sans-serif}
.fr .n{border-bottom:1.5px solid currentColor;padding:0 4px 1px}
.fr .d{padding:1px 4px 0}
.sec-nav{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 6px}
.sec-nav a{font-family:'Poppins',sans-serif;font-size:13px;text-decoration:none;background:#fff;border:1px solid var(--line);color:var(--brand2);padding:5px 12px;border-radius:16px}
.sec-nav a:hover{background:var(--soft)}
button.btn{font-family:'Poppins',sans-serif;background:var(--brand);color:#fff;border:0;padding:9px 18px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:500}
button.btn:hover{background:var(--brand2)}
button.btn.alt{background:#fff;color:var(--brand2);border:1.5px solid var(--brand)}
button.btn.org{background:var(--accent)}
button.btn.grn{background:var(--green)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
label.lb{font-family:'Poppins',sans-serif;font-size:13px;color:var(--muted)}
input[type=number],input[type=text],select{font:inherit;font-family:'Poppins','Noto Sans Malayalam',sans-serif;padding:7px 10px;border:1.5px solid #b9c6e0;border-radius:8px;background:#fff;max-width:100%}
input[type=number]{width:80px}
/* widgets */
.beads{display:flex;flex-wrap:wrap;gap:4px;padding:10px;background:#f1e9dc;border-radius:12px;min-height:46px;border:2px solid #c9b79b}
.bead{width:20px;height:20px;border-radius:50%;border:1.5px solid #333}
.bead.k{background:#222}.bead.w{background:#fff}
.res{background:var(--soft);padding:10px 14px;border-radius:10px;margin-top:10px;font-family:'Poppins','Noto Sans Malayalam',sans-serif;font-size:14.5px}
.pg td{width:44px;height:34px;font-size:12px;font-family:'Poppins',sans-serif;padding:2px}
.pg td.hit{background:#ffd9a8;font-weight:700;border-color:#ff9a3d}
canvas{max-width:100%;border:1px solid var(--line);border-radius:10px;background:#fff}
/* practice */
.q{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:10px 0;background:#fff}
.q .qh{display:flex;gap:8px;align-items:flex-start}
.q .qn{flex:0 0 auto;background:var(--brand);color:#fff;border-radius:50%;width:28px;height:28px;text-align:center;font-family:'Poppins',sans-serif;font-size:13px;line-height:28px;margin-top:2px}
.q .qt{flex:1}
.mk{font-family:'Poppins',sans-serif;font-size:12px;background:#ffe9d6;color:#9a4300;padding:1px 9px;border-radius:10px;margin-left:6px;white-space:nowrap}
details.ans{margin-top:6px}
details.ans summary{cursor:pointer;color:var(--brand);font-family:'Poppins',sans-serif;font-size:13.5px;font-weight:600}
details.ans .a{background:var(--mint);border-radius:8px;padding:8px 12px;margin-top:6px}
/* quiz */
.opt{display:block;width:100%;text-align:left;font:inherit;background:#fff;border:1.5px solid #c9d4ea;border-radius:10px;padding:8px 14px;margin:6px 0;cursor:pointer}
.opt:hover{background:var(--soft)}
.opt.sel{border-color:var(--brand);background:#e3ecff;font-weight:600}
.opt.right{border-color:var(--green);background:#dcf7e6}
.opt.wrong{border-color:var(--red);background:#fde3e3}
.opt .L{display:inline-block;width:24px;font-family:'Poppins',sans-serif;font-weight:600;color:var(--brand2)}
.score{font-family:'Poppins',sans-serif;font-size:46px;font-weight:700;color:var(--brand)}
.bar{background:#e4eaf6;border-radius:8px;height:14px;overflow:hidden;margin:4px 0 10px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#38bdf8)}
.progress{position:sticky;top:112px;z-index:30;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-family:'Poppins',sans-serif;font-size:13px;display:flex;justify-content:space-between;gap:10px;align-items:center}
ol.plain{padding-left:22px}
ul.tight{margin:4px 0;padding-left:22px}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:30px;font-family:'Poppins',sans-serif}
@media(max-width:600px){h2{font-size:20px}.hero .big{font-size:46px}nav{top:92px}.progress{top:142px}}
@media print{header,nav,.noprint,button{display:none!important}.panel{display:none!important}.panel.on{display:block!important}body{background:#fff}.card{box-shadow:none}}
</style>
</head>

  <div class="hwrap">
    <div class="htitle">

<script>
/* ============ helpers ============ */
function fx(s){return s.replace(/\{([^{}\/]+)\/([^{}]+)\}/g,'<span class="fr"><span class="n">$1</span><span class="d">$2</span></span>');}
function B(m,e){return '<span class="ml">'+fx(m)+'</span><span class="en">'+fx(e)+'</span>';}
function P(m,e,cls){return '<p'+(cls?' class="'+cls+'"':'')+'>'+B(m,e)+'</p>';}
function LI(arr){return '<ul class="tight">'+arr.map(function(x){return '<li>'+B(x[0],x[1])+'</li>';}).join('')+'</ul>';}
function gcd(a,b){return b?gcd(b,a%b):a;}
function frac(a,b){var g=gcd(a,b);return '{'+(a/g)+'/'+(b/g)+'}';}
function pct(a,b){return (Math.round(a/b*10000)/100)+'%';}

var TABS=[['home','Overview'],['notes','Notes'],['explore','Explore'],['book','Textbook Solutions'],['practice','Practice'],['test','20-Mark Test'],['teacher','Teacher Corner']];
function showTab(id){
  TABS.forEach(function(t){document.getElementById('p-'+t[0]).classList.toggle('on',t[0]===id);});
  [].forEach.call(document.querySelectorAll('#nav button'),function(b){b.classList.toggle('on',b.dataset.id===id);});
  window.scrollTo({top:0,behavior:'smooth'});
}
function setLang(l){document.body.className='lang-'+l;document.documentElement.lang=l==='ml'?'ml':'en';}
document.getElementById('nav').innerHTML=TABS.map(function(t,i){return '<button data-id="'+t[0]+'" class="'+(i===0?'on':'')+'" onclick="showTab(\''+t[0]+'\')">'+t[1]+'</button>';}).join('');

/* ============ HOME ============ */
document.getElementById('p-home').innerHTML=
'<div class="card hero"><div class="big">4</div><div><h2 style="margin:0">'+B('സാധ്യതകളുടെ ഗണിതം','Mathematics of Chances')+'</h2>'+
P('ഒരു സംഭവം നടക്കാനുള്ള സാധ്യത ഭിന്നസംഖ്യയായും ദശാംശമായും ശതമാനമായും കണ്ടെത്താനും, എണ്ണിയും പരപ്പളവുകൊണ്ടും ജോടികൾ ഉണ്ടാക്കിയും ഈ ആശയം ഉപയോഗിക്കാനും പഠിക്കുന്ന അധ്യായം.','A chapter on finding the chance of an event as a fraction, decimal and percentage — by counting, by comparing areas, and by making pairs.')+'</div></div>'+
'<div class="card"><h3>'+B('ഈ അധ്യായത്തിന്റെ ഘടന','Chapter map')+'</h3><div class="grid">'+
'<div class="mini"><div class="ico">🎲</div><h4>'+B('1. സാധ്യതകളും സംഖ്യകളും','1. Chances and numbers')+'</h4>'+P('ചെപ്പിലെ മുത്തുകൾ, രണ്ടു ചെപ്പുകളുടെ താരതമ്യം, സാധ്യത = {അനുകൂലം/ആകെ}','Beads in bags, comparing two bags, probability = {favourable/total}')+'</div>'+
'<div class="mini"><div class="ico">🔢</div><h4>'+B('2. സംഖ്യാസാധ്യത','2. Probability with numbers')+'</h4>'+P('കടലാസുകഷണങ്ങൾ, ഘടകങ്ങൾ, ദശാംശവും ശതമാനവും','Number slips, factors, decimal and percentage')+'</div>'+
'<div class="mini"><div class="ico">🎯</div><h4>'+B('3. ജ്യാമിതീയസാധ്യത','3. Geometric probability')+'</h4>'+P('വട്ടം കറക്കൽ, കുത്തിടൽ, പരപ്പളവുകളുടെ അംശബന്ധം','Spinners, dropping a dot, ratio of areas')+'</div>'+
'<div class="mini"><div class="ico">👕</div><h4>'+B('4. ജോടികൾ','4. Pairs')+'</h4>'+P('രണ്ടു പെട്ടികളിൽ നിന്ന് ഓരോന്ന്, ആകെ ജോടികൾ = ഗുണനം','One from each of two boxes, total pairs = product')+'</div>'+
'<div class="mini"><div class="ico">🥭</div><h4>'+B('5. കൂടുതൽ ജോടികൾ','5. More pairs')+'</h4>'+P('"ഒന്നെങ്കിലും" സാധ്യത = 1 − "ഒന്നുമില്ല" സാധ്യത','"At least one" = 1 − "none"')+'</div>'+
'<div class="mini"><div class="ico">📊</div><h4>'+B('6. അറിവിന്റെ വിസ്താരം','6. Extra boxes')+'</h4>'+P('മോണ്ടി കാർലോ രീതി, സാധ്യതയും ആവൃത്തിയും, അനിശ്ചിതത്വത്തിന്റെ അളവ്','Monte Carlo method, probability and frequency, measure of uncertainty')+'</div>'+
'</div></div>'+
'<div class="card"><h3>'+B('ഈ അധ്യായം കഴിയുമ്പോൾ നിങ്ങൾക്ക് കഴിയണം','By the end of this chapter you should be able to')+'</h3>'+LI([
['സാധ്യത = {അനുകൂലഫലങ്ങൾ/ആകെ ഫലങ്ങൾ} എന്ന് എഴുതി കണക്കാക്കാൻ','write probability = {favourable outcomes/total outcomes} and calculate it'],
['രണ്ടു സാഹചര്യങ്ങളിലെ സാധ്യതകൾ ഭിന്നസംഖ്യകളായി താരതമ്യം ചെയ്ത് തീരുമാനമെടുക്കാൻ','compare chances in two situations using fractions and make a decision'],
['സാധ്യത ഭിന്നസംഖ്യ, ദശാംശം, ശതമാനം എന്നീ രൂപങ്ങളിൽ എഴുതാൻ','write a probability as a fraction, a decimal and a percentage'],
['വിസ്തീർണ്ണങ്ങളുടെ അംശബന്ധം ഉപയോഗിച്ച് ജ്യാമിതീയസാധ്യത കണ്ടെത്താൻ','find geometric probability using the ratio of areas'],
['ആകെ ജോടികളുടെ എണ്ണം ഗുണനം ഉപയോഗിച്ച് കണ്ടെത്തി "രണ്ടും", "ഒന്നെങ്കിലും" സാധ്യതകൾ കണക്കാക്കാൻ','count pairs by multiplication and find "both" and "at least one" probabilities']
])+'</div>'+
'<div class="card"><h3>'+B('എങ്ങനെ പഠിക്കാം','How to use this portal')+'</h3><ol class="plain">'+
'<li>'+B('<b>Notes</b> വായിച്ച് ഓരോ ആശയവും ഉദാഹരണത്തോടെ മനസ്സിലാക്കുക.','Read the <b>Notes</b> and follow each idea with its example.')+'</li>'+
'<li>'+B('<b>Explore</b> ലെ പരീക്ഷണങ്ങൾ സ്വയം ചെയ്തുനോക്കുക.','Try the experiments in <b>Explore</b> yourself.')+'</li>'+
'<li>'+B('<b>Textbook Solutions</b> ൽ പാഠപുസ്തകത്തിലെ എല്ലാ ചോദ്യങ്ങൾക്കും ഉത്തരം ഘട്ടം ഘട്ടമായി നോക്കാം. ആദ്യം സ്വയം ചെയ്ത ശേഷം മാത്രം നോക്കുക.','<b>Textbook Solutions</b> has step-by-step answers to every textbook question. Try first, then check.')+'</li>'+
'<li>'+B('<b>Practice</b> ൽ Step 1 മുതൽ Step 3 വരെയും പരീക്ഷാരീതിയിലുമുള്ള ചോദ്യങ്ങൾ ചെയ്യുക.','Work through Steps 1 to 3 and exam-style questions in <b>Practice</b>.')+'</li>'+
'<li>'+B('അവസാനം <b>20-Mark Test</b> എഴുതി ആശയം എത്രത്തോളം മനസ്സിലായി എന്ന് പരിശോധിക്കുക.','Finally take the <b>20-Mark Test</b> to check how well the ideas have settled.')+'</li>'+
'</ol></div>';

/* ============ NOTES ============ */
var N='';
N+='<h2>'+B('പഠനക്കുറിപ്പുകൾ','Study Notes')+'</h2><div class="sec-nav">'+
['n1|1 Chances & numbers','n2|2 Numbers','n3|3 Geometric','n4|4 Pairs','n5|5 More pairs','n6|6 Extra boxes','n7|Quick summary'].map(function(s){var a=s.split('|');return '<a href="#'+a[0]+'" onclick="document.getElementById(\''+a[0]+'\').scrollIntoView({behavior:\'smooth\'});return false">'+a[1]+'</a>';}).join('')+'</div>';

N+='<div class="card" id="n1"><h3>'+B('1. സാധ്യതകളും സംഖ്യകളും','1. Chances and numbers')+'</h3>'+
P('ഒരു ചെപ്പിൽ 10 മുത്തുകളുണ്ട്: 9 കറുത്തതും 1 വെളുത്തതും. നോക്കാതെ ഒന്നെടുത്താൽ മിക്കവാറും കറുത്തതായിരിക്കും. എടുക്കുന്നത് വെളുത്തതാകാനും സാധ്യതയുണ്ട്, പക്ഷേ വളരെ കുറവ്.','A bag holds 10 beads: 9 black and 1 white. If you take one without looking, it will most likely be black. White is possible, but much less likely.')+
'<div class="formula">'+B('സാധ്യത = {അനുകൂലഫലങ്ങളുടെ എണ്ണം/ആകെ ഫലങ്ങളുടെ എണ്ണം}','Probability = {number of favourable outcomes/total number of outcomes}')+'</div>'+
P('ഇവിടെ കറുപ്പ് കിട്ടാനുള്ള സാധ്യത {9/10}, വെളുപ്പ് കിട്ടാനുള്ള സാധ്യത {1/10}.','Here the chance of black is {9/10} and the chance of white is {1/10}.')+
'<h4>'+B('രണ്ടു ചെപ്പുകൾ താരതമ്യം ചെയ്യാം','Comparing two bags')+'</h4>'+
P('ഒന്നാം ചെപ്പിൽ 6 കറുത്തതും 5 വെളുത്തതും; രണ്ടാം ചെപ്പിൽ 5 കറുത്തതും 4 വെളുത്തതും. കറുത്ത മുത്ത് കിട്ടിയാൽ ജയിക്കുന്ന കളിയിൽ ഏത് ചെപ്പിൽനിന്നെടുക്കണം?','Bag 1 has 6 black and 5 white beads; Bag 2 has 5 black and 4 white. In a game where you win by getting black, which bag should you pick from?')+
'<div class="scroll"><table class="t"><tr><th></th><th>'+B('ചെപ്പ് 1','Bag 1')+'</th><th>'+B('ചെപ്പ് 2','Bag 2')+'</th></tr>'+
'<tr><td>'+B('കറുപ്പ് / വെളുപ്പ്','black / white')+'</td><td>6 / 5</td><td>5 / 4</td></tr>'+
'<tr><td>'+B('ആകെ','total')+'</td><td>11</td><td>9</td></tr>'+
'<tr><td>'+B('P (കറുപ്പ്)','P (black)')+'</td><td>{6/11}</td><td>{5/9}</td></tr>'+
'<tr><td>'+B('P (വെളുപ്പ്)','P (white)')+'</td><td>{5/11}</td><td>{4/9}</td></tr></table></div>'+
'<div class="key"><b>'+B('എങ്ങനെ താരതമ്യം ചെയ്യും?','How to compare?')+'</b><br>'+B('{6/11} ഉം {5/9} ഉം: ഛേദം തുല്യമാക്കുക (ഛേദങ്ങളുടെ ലസാഗു 99): {54/99} , {55/99}. അതിനാൽ {5/9} വലുത് → ചെപ്പ് 2 ൽ നിന്നെടുക്കുന്നതാണ് നല്ലത്. <br>കുറുക്കുവഴി: വിലങ്ങനെ ഗുണിക്കുക: 6×9 = 54, 5×11 = 55; 55 വലുത്.','Compare {6/11} and {5/9} by a common denominator (LCM 99): {54/99} and {55/99}. So {5/9} is bigger → pick from Bag 2.<br>Shortcut: cross-multiply: 6×9 = 54, 5×11 = 55; 55 is bigger.')+'</div>'+
P('വെളുത്ത മുത്താണ് വേണ്ടതെങ്കിൽ {5/11} ഉം {4/9} ഉം താരതമ്യം ചെയ്യണം: 5×9 = 45, 4×11 = 44. അതിനാൽ {5/11} വലുത് → ചെപ്പ് 1.','If white is wanted, compare {5/11} and {4/9}: 5×9 = 45, 4×11 = 44, so {5/11} is bigger → Bag 1.')+
'<div class="warn"><b>'+B('ശ്രദ്ധിക്കുക','Be careful')+'</b><br>'+B('കറുത്ത മുത്തുകളുടെ എണ്ണം (6, 5) മാത്രം നോക്കിയല്ല തീരുമാനിക്കേണ്ടത്; <u>മൊത്തം മുത്തുകളുടെ എണ്ണവും</u> ചേർത്ത ഭിന്നസംഖ്യ നോക്കണം. ഒരു ചെപ്പിൽ P(കറുപ്പ്) + P(വെളുപ്പ്) = 1 ആയിരിക്കും ({6/11} + {5/11} = 1).','Do not decide by the number of black beads (6, 5) alone. Look at the fraction that includes the <u>total</u>. In one bag P(black) + P(white) = 1 ({6/11} + {5/11} = 1).')+'</div></div>';

N+='<div class="card" id="n2"><h3>'+B('2. സംഖ്യാസാധ്യത','2. Probability with numbers')+'</h3>'+
P('1 മുതൽ 25 വരെ സംഖ്യകൾ കടലാസുകഷണങ്ങളിലെഴുതി പെട്ടിയിലിട്ട് ഒന്നെടുക്കുന്നു.','Numbers 1 to 25 are written on slips of paper, put in a box, and one slip is drawn.')+
'<div class="scroll"><table class="t"><tr><th>'+B('സംഭവം','Event')+'</th><th>'+B('അനുകൂലം','Favourable')+'</th><th>'+B('സാധ്യത','Probability')+'</th></tr>'+
'<tr><td>'+B('ഇരട്ടസംഖ്യ','even number')+'</td><td>12</td><td>{12/25}</td></tr>'+
'<tr><td>'+B('ഒറ്റസംഖ്യ','odd number')+'</td><td>13</td><td>{13/25}</td></tr>'+
'<tr><td>'+B('3 ന്റെ ഗുണിതം (3, 6, …, 24)','multiple of 3 (3, 6, …, 24)')+'</td><td>8</td><td>{8/25}</td></tr>'+
'<tr><td>'+B('6 ന്റെ ഗുണിതം (6, 12, 18, 24)','multiple of 6 (6, 12, 18, 24)')+'</td><td>4</td><td>{4/25}</td></tr></table></div>'+
'<h4>'+B('ഘടകങ്ങളുടെ സാധ്യത','Chance of a factor')+'</h4>'+
P('1, 2, 3, …, 1000 ൽ നിന്ന് ഒരു സംഖ്യയെടുത്താൽ അത് 1000 ന്റെ ഘടകമാകാനുള്ള സാധ്യത?','One number is taken from 1, 2, 3, …, 1000. What is the chance that it is a factor of 1000?')+
'<ol class="plain"><li>'+B('1000 = 2³ × 5³ (അഭാജ്യഘടകങ്ങളുടെ ഗുണനമായി എഴുതുക)','1000 = 2³ × 5³ (write as a product of prime powers)')+'</li>'+
'<li>'+B('ഘടകങ്ങളുടെ എണ്ണം = (3 + 1) × (3 + 1) = 16 (ഘാതങ്ങളോട് 1 കൂട്ടി ഗുണിക്കുക)','number of factors = (3 + 1) × (3 + 1) = 16 (add 1 to each power and multiply)')+'</li>'+
'<li>'+B('സാധ്യത = {16/1000} = {2/125}','probability = {16/1000} = {2/125}')+'</li></ol>'+
'<h4>'+B('ഭിന്നസംഖ്യ → ദശാംശം → ശതമാനം','Fraction → decimal → percentage')+'</h4>'+
'<div class="formula">'+B('{16/1000} = 0.016 &nbsp;;&nbsp; {16/1000} × 100 = 1.6%','{16/1000} = 0.016 &nbsp;;&nbsp; {16/1000} × 100 = 1.6%')+'</div>'+
'<div class="key"><b>'+B('ഉപയോഗപ്രദമായ എണ്ണങ്ങൾ','Handy counts')+'</b>'+LI([
['ഒരക്കസംഖ്യകൾ 9, രണ്ടക്കസംഖ്യകൾ 90, മൂന്നക്കസംഖ്യകൾ 900, നാലക്കസംഖ്യകൾ 9000','one-digit numbers 9, two-digit 90, three-digit 900, four-digit 9000'],
['രണ്ടക്ക പൂർണ്ണവർഗ്ഗങ്ങൾ: 16, 25, 36, 49, 64, 81 (6 എണ്ണം)','two-digit perfect squares: 16, 25, 36, 49, 64, 81 (6 of them)'],
['മൂന്നക്ക ഇരുവഴി (palindrome) സംഖ്യകൾ: 9 × 10 = 90 (ആദ്യ അക്കം 9 രീതി, നടുവിലെ അക്കം 10 രീതി)','three-digit palindromes: 9 × 10 = 90 (9 choices for the first digit, 10 for the middle)'],
['1 മുതൽ 10 വരെ അഭാജ്യസംഖ്യകൾ: 2, 3, 5, 7 (4 എണ്ണം)','primes from 1 to 10: 2, 3, 5, 7 (4 of them)']
])+'</div></div>';

N+='<div class="card" id="n3"><h3>'+B('3. ജ്യാമിതീയസാധ്യത','3. Geometric probability')+'</h3>'+
P('പല നിറങ്ങളുള്ള 8 തുല്യ ഭാഗങ്ങളുള്ള വട്ടം കറക്കുമ്പോൾ അമ്പടയാളത്തിനു നേരെ മഞ്ഞ വരാനുള്ള സാധ്യത: 8 ഭാഗങ്ങളിൽ 3 എണ്ണം മഞ്ഞ → {3/8}. ഇതേപോലെ മറ്റു നിറങ്ങൾക്കും കണക്കാക്കാം.','A disc with 8 equal parts of different colours is spun. The chance that the arrow stops on yellow: 3 of 8 parts are yellow → {3/8}. Other colours work the same way.')+
P('ഇവിടെ വൈവിധ്യം: ഭാഗങ്ങൾ തുല്യമായിരിക്കുമ്പോൾ എണ്ണം നോക്കിയാൽ മതി. തുല്യമല്ലെങ്കിൽ <b>വിസ്തീർണ്ണം</b> (പരപ്പളവ്) നോക്കണം.','When the parts are equal we can simply count them. When they are not equal we must compare <b>areas</b>.')+
'<div class="formula">'+B('സാധ്യത = {അനുകൂലഭാഗത്തിന്റെ പരപ്പളവ്/ആകെ ഭാഗത്തിന്റെ പരപ്പളവ്}','Probability = {area of the favourable region/area of the whole region}')+'</div>'+
'<h4>'+B('ഉദാഹരണം: ചതുരത്തിലെ ത്രികോണം','Example: triangle inside a rectangle')+'</h4>'+
P('ചതുരത്തിന്റെ ഒരു വശത്തിന്റെ മധ്യബിന്ദുവും എതിർവശത്തിന്റെ മൂലകളും ചേർത്ത് ത്രികോണം വരച്ചാൽ ത്രികോണത്തിനും ചതുരത്തിനും ഒരേ പാദവും ഒരേ ഉയരവും. ത്രികോണത്തിന്റെ പരപ്പളവ് = ചതുരത്തിന്റെ പകുതി. അതിനാൽ കുത്ത് ത്രികോണത്തിനകത്താകാനുള്ള സാധ്യത {1/2}.','A triangle is drawn using one side of a rectangle as its base and the midpoint of the opposite side as the apex: it has the same base and height as the rectangle. Its area is half the rectangle. So the chance that the dot lies inside the triangle is {1/2}.')+
'<div class="scroll"><table class="t"><tr><th>'+B('ചിത്രം','Figure')+'</th><th>'+B('പച്ച ഭാഗം','Green part')+'</th><th>'+B('സാധ്യത','Probability')+'</th></tr>'+
'<tr><td>'+B('സമചതുരത്തിൽ മധ്യബിന്ദുക്കൾ യോജിപ്പിച്ച സമചതുരം','square joining midpoints of a square')+'</td><td>'+B('ചെറിയ സമചതുരം','inner square')+'</td><td>{1/2}</td></tr>'+
'<tr><td>'+B('സമഷഡ്ഭുജത്തിലെ ഒന്നിടവിട്ട മൂലകൾ ചേർത്ത ത്രികോണം','triangle on alternate vertices of a regular hexagon')+'</td><td>'+B('ത്രികോണം','triangle')+'</td><td>{1/2}</td></tr>'+
'<tr><td>'+B('രണ്ടു തുല്യസമഭുജത്രികോണങ്ങൾക്കിടയിലെ സമഷഡ്ഭുജം','hexagon in the middle of a six-pointed star')+'</td><td>'+B('നടുവിലെ ഷഡ്ഭുജം','central hexagon')+'</td><td>{1/2}</td></tr>'+
'<tr><td>'+B('വൃത്തത്തിനകത്ത് ചേർന്ന സമചതുരം','square inside a circle')+'</td><td>'+B('സമചതുരം','square')+'</td><td>{2/π} ≈ 0.64</td></tr>'+
'<tr><td>'+B('സമചതുരത്തിനകത്ത് ചേർന്ന വൃത്തം','circle inside a square')+'</td><td>'+B('വൃത്തം','circle')+'</td><td>{π/4} ≈ 0.785</td></tr></table></div>'+
'<div class="note"><b>'+B('മോണ്ടി കാർലോ രീതി','Monte Carlo method')+'</b><br>'+B('സങ്കീർണ്ണമായ രൂപത്തിന്റെ പരപ്പളവ് കണ്ടുപിടിക്കാൻ: അറിയാവുന്ന ഒരു സമചതുരത്തിനകത്ത് രൂപം വരച്ച്, ക്രമരഹിതമായി ധാരാളം കുത്തുകളിടുക. രൂപത്തിനകത്ത് വീണ കുത്തുകളുടെ എണ്ണത്തെ ആകെ കുത്തുകൾ കൊണ്ട് ഹരിച്ചാൽ കിട്ടുന്ന സംഖ്യ ≈ (രൂപത്തിന്റെ പരപ്പളവ്) ÷ (സമചതുരത്തിന്റെ പരപ്പളവ്). കുത്തുകൾ കൂടുന്തോറും കൃത്യത കൂടും. (Explore ൽ ഇത് പരീക്ഷിക്കാം.)','To estimate the area of a complicated shape: draw it inside a square of known area and drop many random dots. (dots inside the shape) ÷ (all dots) ≈ (area of shape) ÷ (area of square). More dots give a better estimate. (Try it in Explore.)')+'</div></div>';

N+='<div class="card" id="n4"><h3>'+B('4. ജോടികൾ','4. Pairs')+'</h3>'+
P('ജോണിക്ക് ചുവപ്പ്, പച്ച, നീല ഷർട്ടുകളും നീല, പച്ച പാന്റ്സുകളുമുണ്ട്. ഓരോ ഷർട്ടിനോടൊപ്പവും രണ്ടു പാന്റ്സ് ഇടാം → 3 × 2 = <b>6</b> വ്യത്യസ്ത രീതികൾ. ഇതിൽ ഷർട്ടും പാന്റ്സും ഒരേ നിറമാകുന്നത് 2 രീതികളിൽ (പച്ച-പച്ച, നീല-നീല). അതിനാൽ സാധ്യത {2/6} = {1/3}.','Johnny has red, green and blue shirts and blue and green trousers. Each shirt can go with 2 trousers → 3 × 2 = <b>6</b> different outfits. Shirt and trousers have the same colour in 2 outfits (green-green, blue-blue). So the probability is {2/6} = {1/3}.')+
'<h4>'+B('രണ്ടു പെട്ടികൾ','Two boxes')+'</h4>'+
P('പെട്ടി 1: 1, 2, 3, 4 ; പെട്ടി 2: 1, 2. ഓരോന്നിൽനിന്നും ഓരോ കടലാസെടുക്കുമ്പോൾ ലഭിക്കുന്ന ജോടികൾ:','Box 1: 1, 2, 3, 4 ; Box 2: 1, 2. Pairs obtained by taking one slip from each:')+

function drawWheel(){
  var s='';for(var i=0;i<8;i++){var a0=(i*45-90-22.5)*Math.PI/180,a1=((i+1)*45-90-22.5)*Math.PI/180;
    s+='<path d="M0 0 L'+(90*Math.cos(a0)).toFixed(2)+' '+(90*Math.sin(a0)).toFixed(2)+' A90 90 0 0 1 '+(90*Math.cos(a1)).toFixed(2)+' '+(90*Math.sin(a1)).toFixed(2)+' Z" fill="'+COL[i][0]+'" stroke="#fff" stroke-width="2" '+(i===spinLast?'opacity="1" stroke="#000" stroke-width="3"':(spinLast>=0?'opacity=".45"':''))+'/>';}
  s+='<circle r="5" fill="#e11"/><polygon points="96,0 112,-8 112,8" fill="#e11" transform="rotate(-90)"/>';
  document.getElementById('wheel').innerHTML=s;
}
function spin(n){for(var i=0;i<n;i++){spinLast=Math.floor(Math.random()*8);spinT[COL[spinLast][1]]++;spinN++;}drawWheel();spinShow();}
function spinReset(){spinT={Yellow:0,Purple:0,Blue:0,Orange:0};spinN=0;spinLast=-1;drawWheel();spinShow();}
function spinShow(){
  var th={Yellow:3,Purple:2,Blue:2,Orange:1},h='<table class="t" style="font-size:13px"><tr><th>Colour</th><th>Calculated</th><th>Spins</th><th>Experiment</th></tr>';
  for(var k in th){h+='<tr><td>'+k+'</td><td>'+fx('{'+th[k]+'/8}')+'</td><td>'+spinT[k]+'</td><td>'+(spinN?(spinT[k]/spinN).toFixed(3):'–')+'</td></tr>';}
  document.getElementById('spinres').innerHTML=h+'</table>Total spins: '+spinN;
}
/* pairs */
function pairDraw(){
  var n=Math.max(2,Math.min(12,+document.getElementById('pn').value||4)),m=Math.max(2,Math.min(10,+document.getElementById('pm').value||2)),c=document.getElementById('pc').value;
  var f={bo:function(a,b){return a%2&&b%2;},be:function(a,b){return !(a%2)&&!(b%2);},so:function(a,b){return (a+b)%2===1;},se:function(a,b){return (a+b)%2===0;},eq:function(a,b){return a===b;},po:function(a,b){return (a*b)%2===1;},pe:function(a,b){return (a*b)%2===0;}}[c];
  var h='<table class="t pg"><tr><th></th>',hit=0;
  for(var j=1;j<=m;j++)h+='<th>'+j+'</th>';h+='</tr>';
  for(var i=1;i<=n;i++){h+='<tr><th>'+i+'</th>';for(var k=1;k<=m;k++){var ok=f(i,k);if(ok)hit++;h+='<td class="'+(ok?'hit':'')+'">('+i+','+k+')</td>';}h+='</tr>';}
  h+='</table>';
  document.getElementById('pgrid').innerHTML=h;
  var tot=n*m;
  document.getElementById('pres').innerHTML='Total pairs = '+n+' × '+m+' = <b>'+tot+'</b> &nbsp;|&nbsp; Favourable = <b>'+hit+'</b><br>Probability = '+fx('{'+hit+'/'+tot+'}')+(hit?' = '+fx(frac(hit,tot)):'')+' = '+(hit/tot).toFixed(3)+' = '+pct(hit,tot);
}
/* darts */
var dIn=0,dTot=0,dPts=[];
function inShape(t,x,y){ // x,y in 0..1 (x), 0..1 (y)
  if(t==='tri'){return y>=(1-1)&&(function(){var yy=1-y;var half=(1-yy)/2; /* triangle apex top centre, base bottom */ return Math.abs(x-0.5)<=half*1;})();}
  if(t==='cis'){return Math.pow(x-.5,2)+Math.pow(y-.5,2)<=.25;}
  if(t==='sic'){return Math.abs(x-.5)<=Math.SQRT1_2*.5*1&&Math.abs(y-.5)<=Math.SQRT1_2*.5*1;}
}
function drawBoard(){
  var c=document.getElementById('cv'),g=c.getContext('2d'),t=document.getElementById('dshape').value;
  g.clearRect(0,0,320,220);g.lineWidth=2;
  if(t==='tri'){g.strokeStyle='#999';g.fillStyle='#fdebd0';g.fillRect(10,10,300,200);g.strokeRect(10,10,300,200);g.fillStyle='rgba(220,40,40,.35)';g.beginPath();g.moveTo(10,210);g.lineTo(310,210);g.lineTo(160,10);g.closePath();g.fill();g.stroke();}
  if(t==='cis'){g.strokeStyle='#999';g.fillStyle='#fdebd0';g.fillRect(60,10,200,200);g.strokeRect(60,10,200,200);g.fillStyle='rgba(40,160,70,.35)';g.beginPath();g.arc(160,110,100,0,7);g.fill();g.stroke();}
  if(t==='sic'){var r=100;g.strokeStyle='#999';g.fillStyle='#fdebd0';g.beginPath();g.arc(160,110,r,0,7);g.fill();g.stroke();g.fillStyle='rgba(40,160,70,.35)';var s=r/Math.SQRT2;g.fillRect(160-s,110-s,2*s,2*s);g.strokeRect(160-s,110-s,2*s,2*s);}
}
function dartBox(t){if(t==='tri')return [10,10,300,200];if(t==='cis')return [60,10,200,200];return [60,10,200,200];}
function dartAdd(n){
  var t=document.getElementById('dshape').value,c=document.getElementById('cv'),g=c.getContext('2d'),b=dartBox(t);
  if(dTot===0)drawBoard();
  for(var i=0;i<n;i++){var x=Math.random(),y=Math.random(),ok;
    if(t==='tri'){var yy=1-y;ok=Math.abs(x-.5)<=(1-yy)/2;}else if(t==='cis'){ok=(x-.5)*(x-.5)+(y-.5)*(y-.5)<=.25;}else{ok=(x-.5)*(x-.5)+(y-.5)*(y-.5)<=.25&&Math.abs(x-.5)<=.3536&&Math.abs(y-.5)<=.3536;}
    if(t==='sic'){ /* sample inside circle's bounding square; square (inside) vs circle (whole) → use circle as whole */
      var xx=Math.random()*2-1,yy2=Math.random()*2-1; while(xx*xx+yy2*yy2>1){xx=Math.random()*2-1;yy2=Math.random()*2-1;}
      ok=Math.abs(xx)<=.7071&&Math.abs(yy2)<=.7071;
      g.fillStyle=ok?'#15803d':'#c2410c';g.fillRect(160+xx*100-1.5,110+yy2*100-1.5,3,3);
    }else{g.fillStyle=ok?'#15803d':'#c2410c';g.fillRect(b[0]+x*b[2]-1.5,b[1]+y*b[3]-1.5,3,3);}
    dTot++;if(ok)dIn++;}
  var ex={tri:0.5,cis:Math.PI/4,sic:2/Math.PI}[t];
  document.getElementById('dres').innerHTML='Dots: '+dTot+' &nbsp;|&nbsp; Inside (shaded): '+dIn+'<br>Experiment: '+(dIn/dTot).toFixed(4)+' &nbsp;|&nbsp; Calculated: '+ex.toFixed(4);
}
function dartReset(){dIn=0;dTot=0;drawBoard();document.getElementById('dres').innerHTML='Press + to drop dots.';}

  'നക്ഷത്രത്തെ ഒരേ വലിപ്പമുള്ള ചെറിയ 12 സമഭുജത്രികോണങ്ങളായി ഭാഗിക്കാം: നടുവിലെ ഷഡ്ഭുജം 6 എണ്ണം, ആറ് മുനകൾ 6 എണ്ണം. സാധ്യത = {6/12} = {1/2}.','Divide the star into 12 small equal equilateral triangles: the middle hexagon has 6 and the six points have 6. Probability = {6/12} = {1/2}.'],
 ['(4) മൂലകളെല്ലാം ഒരു വൃത്തത്തിലായി വരച്ച സമചതുരം (പച്ച), വൃത്തത്തിൽ കുത്തിടുന്നു.','(4) A square with all corners on a circle (green); the dot is dropped in the circle.',
  'വൃത്തത്തിന്റെ ആരം r. സമചതുരത്തിന്റെ വികർണ്ണം 2r → വശം r√2 → പരപ്പളവ് 2r². വൃത്തത്തിന്റേത് πr². സാധ്യത = {2r²/πr²} = {2/π} ≈ 0.64.','Circle radius r. The diagonal of the square is 2r → side r√2 → area 2r². Circle area πr². Probability = {2r²/πr²} = {2/π} ≈ 0.64.'],
 ['(5) സമചതുരത്തിനകത്ത് കൃത്യമായി ചേർന്നിരിക്കുന്ന വൃത്തം (പച്ച).','(5) A circle that fits exactly inside a square (green).',
  'വൃത്തത്തിന്റെ ആരം r ആയാൽ സമചതുരത്തിന്റെ വശം 2r → പരപ്പളവ് 4r². വൃത്തം πr². സാധ്യത = {πr²/4r²} = {π/4} ≈ 0.785.','If the circle has radius r, the square has side 2r → area 4r². Circle = πr². Probability = {πr²/4r²} = {π/4} ≈ 0.785.']]},
{h:['പേജ് 80, 81 – ജോടികൾ','Pages 80, 81 – Pairs'],qs:[
 ['(1) രജനിക്ക് പച്ച, നീല, ചുവപ്പ് നിറങ്ങളിൽ കല്ലുമാലയും കമ്മലുമുണ്ട്. എത്ര രീതികളിൽ മാലയും കമ്മലുമണിയാം? ഒരേ നിറമുള്ള മാലയും കമ്മലും അണിയാനുള്ള സാധ്യത? വ്യത്യസ്ത നിറമുള്ളതോ?','(1) Rajani has stone necklaces and earrings in green, blue and red. In how many ways can she wear a necklace and earrings? Chance of the same colour? of different colours?',
  'രീതികൾ = 3 × 3 = 9.<br>ഒരേ നിറം 3 രീതി → {3/9} = {1/3}.<br>വ്യത്യസ്ത നിറം 9 − 3 = 6 → {6/9} = {2/3}.','Ways = 3 × 3 = 9.<br>Same colour: 3 ways → {3/9} = {1/3}.<br>Different: 9 − 3 = 6 → {6/9} = {2/3}.'],
 ['(2) ഒരു പെട്ടിയിൽ 1, 2, 3, 4 എഴുതിയ 4 കടലാസുകൾ; മറ്റൊന്നിൽ 1, 2. ഓരോന്നിൽനിന്നുമെടുത്താൽ കിട്ടുന്ന സംഖ്യകളുടെ തുക ഒറ്റസംഖ്യയാകാനുള്ള സാധ്യത? ഇരട്ടസംഖ്യയാകാനോ?','(2) Box 1 has slips 1, 2, 3, 4; box 2 has 1, 2. One from each. Chance the sum is odd? even?',
  'ജോടികൾ 8: തുകകൾ 2, 3, 3, 4, 4, 5, 5, 6.<br>ഒറ്റ: 3, 3, 5, 5 → 4 → {4/8} = {1/2}.<br>ഇരട്ട: 4 → {1/2}.','8 pairs; sums: 2, 3, 3, 4, 4, 5, 5, 6.<br>Odd: 3, 3, 5, 5 → 4 → {4/8} = {1/2}.<br>Even: 4 → {1/2}.'],
 ['(3) ഒരു പെട്ടിയിൽ 1, 2, 3, 4; മറ്റൊന്നിൽ 1, 2, 3. ഗുണനഫലം ഒറ്റസംഖ്യയാകാനുള്ള സാധ്യത? ഇരട്ടസംഖ്യയാകാനോ?','(3) Box 1 has 1, 2, 3, 4; box 2 has 1, 2, 3. Chance the product is odd? even?',
  'ആകെ ജോടികൾ 4 × 3 = 12.<br>ഗുണനഫലം ഒറ്റ ആകണമെങ്കിൽ രണ്ടും ഒറ്റ: 2 × 2 = 4 → {4/12} = {1/3}.<br>ഇരട്ട: 12 − 4 = 8 → {8/12} = {2/3}.','Total pairs 4 × 3 = 12.<br>Product is odd only if both are odd: 2 × 2 = 4 → {4/12} = {1/3}.<br>Even: 12 − 4 = 8 → {8/12} = {2/3}.'],
 ['(4) 1, 2, 3 അക്കങ്ങൾ ഉപയോഗിച്ച് എഴുതാവുന്ന രണ്ടക്കസംഖ്യകളിൽ ഒരെണ്ണമെടുത്താൽ (i) രണ്ടക്കങ്ങളും തുല്യമാകാനുള്ള സാധ്യത? (ii) അക്കങ്ങളുടെ തുക 4 ആകാനുള്ള സാധ്യത?','(4) From the two-digit numbers that can be written using digits 1, 2, 3, one is taken. (i) Chance both digits are equal? (ii) Chance the digit sum is 4?',
  'സംഖ്യകൾ (അക്കം ആവർത്തിക്കാം): 11, 12, 13, 21, 22, 23, 31, 32, 33 → 3 × 3 = 9.<br>(i) 11, 22, 33 → {3/9} = {1/3}.<br>(ii) 13, 22, 31 → {3/9} = {1/3}.','Numbers (digits may repeat): 11, 12, 13, 21, 22, 23, 31, 32, 33 → 3 × 3 = 9.<br>(i) 11, 22, 33 → {3/9} = {1/3}.<br>(ii) 13, 22, 31 → {3/9} = {1/3}.'],
 ['(5) രണ്ടുപേർ തമ്മിലുള്ള കളി: ഓരോരുത്തരും ഒറ്റസംഖ്യവേണോ ഇരട്ടസംഖ്യവേണോ എന്ന് തീരുമാനിക്കണം. ഇരുവരും ഒരു കൈയിലെ കുറെ വിരലുകൾ ഒരുമിച്ചുയർത്തുന്നു. ആകെ വിരലുകൾ ഒറ്റസംഖ്യയാണെങ്കിൽ ഒറ്റസംഖ്യ എടുത്തയാൾ ജയിക്കും. ഏത് എടുക്കുന്നതാണ് നല്ലത്? (ഓരോരുത്തരും 1 മുതൽ 5 വരെ വിരലുകൾ ഉയർത്തുമെന്ന് കരുതുക)','(5) Two players each choose "odd" or "even". Both raise some fingers of one hand together; if the total is odd, the player who chose odd wins. Which is the better choice? (Assume each raises 1 to 5 fingers.)',
  'ആകെ ജോടികൾ 5 × 5 = 25.<br>തുക ഒറ്റ: ഒരാൾ ഒറ്റ, മറ്റേയാൾ ഇരട്ട → 3×2 + 2×3 = 12 → {12/25}.<br>തുക ഇരട്ട: 25 − 12 = 13 → {13/25}.<br>അതിനാൽ <b>ഇരട്ടസംഖ്യ</b> എടുക്കുന്നതാണ് അല്പം നല്ലത്.','Total pairs 5 × 5 = 25.<br>Sum odd: one odd and one even → 3×2 + 2×3 = 12 → {12/25}.<br>Sum even: 25 − 12 = 13 → {13/25}.<br>So choosing <b>even</b> is slightly better.']]},
{h:['പേജ് 83, 84 – കൂടുതൽ ജോടികൾ','Pages 83, 84 – More pairs'],qs:[
 ['(1) 10 A ക്ലാസിൽ 30 ആൺകുട്ടികളും 20 പെൺകുട്ടികളും; 10 B ക്ലാസിൽ 15 ആൺകുട്ടികളും 25 പെൺകുട്ടികളും. ഓരോ ക്ലാസിൽ നിന്നും ഒരു കുട്ടിയെ തിരഞ്ഞെടുക്കുന്നു. (i) രണ്ടും പെൺകുട്ടികൾ (ii) രണ്ടും ആൺകുട്ടികൾ (iii) ഒരു ആൺകുട്ടിയും ഒരു പെൺകുട്ടിയും (iv) ഒരാളെങ്കിലും ആൺകുട്ടി – സാധ്യത?','(1) Class 10 A has 30 boys and 20 girls; 10 B has 15 boys and 25 girls. One child is chosen from each class. Chance of (i) both girls (ii) both boys (iii) one boy and one girl (iv) at least one boy?',
  'ആകെ ജോടികൾ 50 × 40 = 2000.<br>(i) 20 × 25 = 500 → {500/2000} = {1/4}.<br>(ii) 30 × 15 = 450 → {450/2000} = {9/40}.<br>(iii) 30×25 + 20×15 = 750 + 300 = 1050 → {1050/2000} = {21/40}.<br>(iv) 1 − P(രണ്ടും പെൺകുട്ടികൾ) = 1 − {1/4} = {3/4}. (പരിശോധന: 450 + 1050 = 1500 → {1500/2000} = {3/4} ✓)','Total pairs 50 × 40 = 2000.<br>(i) 20 × 25 = 500 → {500/2000} = {1/4}.<br>(ii) 30 × 15 = 450 → {450/2000} = {9/40}.<br>(iii) 30×25 + 20×15 = 750 + 300 = 1050 → {1050/2000} = {21/40}.<br>(iv) 1 − P(both girls) = 1 − {1/4} = {3/4}. (Check: 450 + 1050 = 1500 → {1500/2000} = {3/4} ✓)'],
 ['(2) ഒരാളോട് ഒരു രണ്ടക്കസംഖ്യ പറയാനാവശ്യപ്പെടുന്നു. (i) രണ്ടക്കങ്ങളും തുല്യമാകാനുള്ള സാധ്യത? (ii) ആദ്യത്തെ അക്കം രണ്ടാമത്തേതിനേക്കാൾ വലുതാകാനുള്ള സാധ്യത? (iii) ആദ്യത്തെ അക്കം രണ്ടാമത്തേതിനേക്കാൾ ചെറുതാകാനുള്ള സാധ്യത?','(2) A person says a two-digit number. (i) Chance both digits are equal? (ii) first digit bigger than second? (iii) first digit smaller than second?',
  'ആകെ 90 സംഖ്യകൾ.<br>(i) 11, 22, …, 99 → 9 → {9/90} = {1/10}.<br>(ii) പത്തിന്റെ സ്ഥാനത്ത് a ആയാൽ ഒന്നിന്റെ സ്ഥാനത്ത് a യേക്കാൾ ചെറിയ അക്കങ്ങൾ a എണ്ണം (0 മുതൽ a−1 വരെ): 1+2+…+9 = 45 → {45/90} = {1/2}.<br>(iii) a യേക്കാൾ വലിയ അക്കങ്ങൾ 9 − a എണ്ണം: 8+7+…+0 = 36 → {36/90} = {2/5}.<br>പരിശോധന: 9 + 45 + 36 = 90 ✓','90 numbers in all.<br>(i) 11, 22, …, 99 → 9 → {9/90} = {1/10}.<br>(ii) If the tens digit is a, there are a smaller digits (0 to a−1) for the units place: 1+2+…+9 = 45 → {45/90} = {1/2}.<br>(iii) There are 9 − a bigger digits: 8+7+…+0 = 36 → {36/90} = {2/5}.<br>Check: 9 + 45 + 36 = 90 ✓'],
 ['(3) 1 മുതൽ 6 വരെ സംഖ്യകളെഴുതിയ രണ്ടു പകിടകൾ ഒന്നിച്ചുരുട്ടുന്നു. കിട്ടുന്ന സംഖ്യകളുടെ തുക ഏതൊക്കെയാകാം? ഏറ്റവും കൂടുതൽ സാധ്യതയുള്ള തുക ഏത്?','(3) Two dice numbered 1 to 6 are rolled together. What sums are possible? Which sum is most likely?',
  'സാധ്യമായ തുകകൾ: 2, 3, …, 12. ആകെ ജോടികൾ 6 × 6 = 36.<br>തുക 7 കിട്ടുന്നത് 6 രീതി: (1,6),(2,5),(3,4),(4,3),(5,2),(6,1) – ഏറ്റവും കൂടുതൽ. P(7) = {6/36} = {1/6}.<br>(തുക 2 → (1,1) മാത്രം → {1/36}; തുക 12 → (6,6) മാത്രം → {1/36}.)','Possible sums: 2, 3, …, 12. Total pairs 6 × 6 = 36.<br>Sum 7 occurs in 6 ways: (1,6),(2,5),(3,4),(4,3),(5,2),(6,1) – the most. P(7) = {6/36} = {1/6}.<br>(Sum 2 → only (1,1) → {1/36}; sum 12 → only (6,6) → {1/36}.)'],
 ['(4) ഒരു പെട്ടിയിൽ 1 മുതൽ 10 വരെയെഴുതിയ 10 കടലാസുകൾ; മറ്റൊന്നിൽ 25 വരെയുള്ള 5 ന്റെ ഗുണിതങ്ങളെഴുതിയ കടലാസുകൾ. ഓരോന്നിൽനിന്നും ഒന്നെടുക്കുന്നു. (i) രണ്ടും ഒറ്റസംഖ്യ (ii) ഗുണനഫലം ഒറ്റസംഖ്യ (iii) തുക ഒറ്റസംഖ്യ – സാധ്യത?','(4) Box 1 has slips 1 to 10; box 2 has slips with the multiples of 5 up to 25. One slip from each. Chance of (i) both odd (ii) product odd (iii) sum odd?',
  'പെട്ടി 2: 5, 10, 15, 20, 25 (ഒറ്റ: 5, 15, 25 = 3 ; ഇരട്ട: 10, 20 = 2). ആകെ ജോടികൾ 10 × 5 = 50.<br>(i) 5 × 3 = 15 → {15/50} = {3/10}.<br>(ii) ഗുണനഫലം ഒറ്റ ആകാൻ രണ്ടും ഒറ്റ വേണം → {3/10}.<br>(iii) തുക ഒറ്റ → ഒന്ന് ഒറ്റ, ഒന്ന് ഇരട്ട: 5×2 + 5×3 = 10 + 15 = 25 → {25/50} = {1/2}.','Box 2: 5, 10, 15, 20, 25 (odd: 5, 15, 25 = 3 ; even: 10, 20 = 2). Total pairs 10 × 5 = 50.<br>(i) 5 × 3 = 15 → {15/50} = {3/10}.<br>(ii) A product is odd only if both are odd → {3/10}.<br>(iii) Sum odd → one odd, one even: 5×2 + 5×3 = 10 + 15 = 25 → {25/50} = {1/2}.']]}
];

 ['1 മുതൽ 30 വരെയുള്ള സംഖ്യകളിൽ ഒന്നെടുത്താൽ ഒറ്റസംഖ്യയാകാനുള്ള സാധ്യത?','One number from 1 to 30. Chance it is odd?','15 ഒറ്റസംഖ്യകൾ → {15/30} = {1/2}','15 odd numbers → {15/30} = {1/2}'],
 ['സാധ്യത {7/20} ആണ്. ഇത് ദശാംശമായും ശതമാനമായും എഴുതുക.','A probability is {7/20}. Write it as a decimal and a percentage.','{7/20} = {35/100} = 0.35 ; 0.35 × 100 = 35%','{7/20} = {35/100} = 0.35 ; 0.35 × 100 = 35%'],
 ['1 മുതൽ 10 വരെ സംഖ്യകൾ എഴുതിയ 10 തുല്യഭാഗങ്ങളുള്ള ഒരു ചക്രം കറക്കുന്നു. അഭാജ്യസംഖ്യ വരാനുള്ള സാധ്യത?','A disc has 10 equal parts numbered 1 to 10 and is spun. Chance of a prime number?','2, 3, 5, 7 → {4/10} = {2/5}','2, 3, 5, 7 → {4/10} = {2/5}'],
 ['6 കറുത്തതും 4 വെളുത്തതും മുത്തുകളുള്ള ചെപ്പിൽ P(കറുപ്പ്) + P(വെളുപ്പ്) എത്ര?','In a bag with 6 black and 4 white beads, find P(black) + P(white).','{6/10} + {4/10} = 1','{6/10} + {4/10} = 1']]},
{id:'s2',h:['Step 2 – കൂടുതൽ ഉറപ്പിക്കാം','Step 2 – Build up'],sub:['രണ്ടോ മൂന്നോ ഘട്ടമുള്ള ചോദ്യങ്ങൾ. ഓരോന്നിനും 2 സ്കോർ.','Two or three step questions. 2 marks each.'],mk:2,qs:[
 ['1 മുതൽ 50 വരെ സംഖ്യകളിൽനിന്ന് ഒന്നെടുത്താൽ 7 ന്റെ ഗുണിതമാകാനുള്ള സാധ്യത ദശാംശമായും ശതമാനമായും എഴുതുക.','One number from 1 to 50. Write the chance of a multiple of 7 as a decimal and a percentage.','7, 14, …, 49 → 7 സംഖ്യകൾ → {7/50} = 0.14 = 14%','7, 14, …, 49 → 7 numbers → {7/50} = 0.14 = 14%'],
 ['എല്ലാ മൂന്നക്കസംഖ്യകളിൽനിന്നും ഒന്നെടുത്താൽ അത് 5 ന്റെ ഗുണിതമാകാനുള്ള സാധ്യത?','One number is taken from all three-digit numbers. Chance it is a multiple of 5?','100, 105, …, 995 → (995 − 100) ÷ 5 + 1 = 180 ; മൂന്നക്കസംഖ്യകൾ 900 → {180/900} = {1/5}','100, 105, …, 995 → (995 − 100)÷5 + 1 = 180 ; three-digit numbers 900 → {180/900} = {1/5}'],
 ['രണ്ടക്കസംഖ്യകളിൽനിന്ന് ഒന്നെടുത്താൽ അത് 11 ന്റെ ഗുണിതമാകാനുള്ള സാധ്യത?','One two-digit number is taken. Chance it is a multiple of 11?','11, 22, …, 99 → 9 → {9/90} = {1/10}','11, 22, …, 99 → 9 → {9/90} = {1/10}'],
 ['ചെപ്പ് A യിൽ 5 ചുവപ്പും 3 നീലയും, ചെപ്പ് B യിൽ 4 ചുവപ്പും 2 നീലയും മുത്തുകളാണ്. ചുവപ്പ് കിട്ടാൻ കൂടുതൽ സാധ്യത ഏത് ചെപ്പിൽനിന്ന്?','Bag A has 5 red and 3 blue beads; bag B has 4 red and 2 blue. From which bag is red more likely?','A: {5/8} ; B: {4/6} = {2/3}. വിലങ്ങനെ ഗുണിക്കുക: 5×3 = 15 , 2×8 = 16 → {2/3} വലുത് → <b>ചെപ്പ് B</b>','A: {5/8} ; B: {4/6} = {2/3}. Cross-multiply: 5×3 = 15 , 2×8 = 16 → {2/3} is bigger → <b>bag B</b>'],
 ['20 സെ.മീ × 10 സെ.മീ ഉള്ള ഒരു ചതുരബോർഡിനകത്ത് 10 സെ.മീ × 4 സെ.മീ ഉള്ള ഒരു ചതുരം ചായം പൂശിയിരിക്കുന്നു. ബോർഡിൽ കണ്ണടച്ച് കുത്തിട്ടാൽ ചായം പൂശിയ ഭാഗത്താകാനുള്ള സാധ്യത?','A 20 cm × 10 cm board has a 10 cm × 4 cm rectangle painted on it. A dot is dropped blindly on the board. Chance it lands on the painted part?','{40/200} = {1/5}','{40/200} = {1/5}'],
 ['ഒരു പെട്ടിയിൽ 1 മുതൽ 6 വരെയും മറ്റൊന്നിൽ 1 മുതൽ 3 വരെയും എഴുതിയ കടലാസുകളുണ്ട്. ഓരോന്നിൽനിന്നുമെടുത്താൽ രണ്ടും ഇരട്ടസംഖ്യയാകാനുള്ള സാധ്യത?','One box has slips 1 to 6 and another has 1 to 3. One slip from each. Chance both are even?','ആകെ 6 × 3 = 18 ; ഇരട്ട: 3 × 1 = 3 → {3/18} = {1/6}','Total 6 × 3 = 18 ; even: 3 × 1 = 3 → {3/18} = {1/6}'],
 ['ഒരു പെട്ടിയിൽ 1 മുതൽ 8 വരെയും മറ്റൊന്നിൽ 1 മുതൽ 5 വരെയും എഴുതിയ കടലാസുകൾ. ഓരോന്നിൽനിന്നുമെടുത്താൽ തുക ഇരട്ടസംഖ്യയാകാനുള്ള സാധ്യത?','One box has slips 1 to 8 and another 1 to 5. One slip from each. Chance the sum is even?','ആകെ 8 × 5 = 40. രണ്ടും ഒറ്റ: 4 × 3 = 12 ; രണ്ടും ഇരട്ട: 4 × 2 = 8. ആകെ 20 → {20/40} = {1/2}','Total 8 × 5 = 40. Both odd: 4 × 3 = 12 ; both even: 4 × 2 = 8. Total 20 → {20/40} = {1/2}'],
 ['ഒരു നാണയം എറിയുകയും ഒരു പകിട ഉരുട്ടുകയും ചെയ്യുന്നു. തല വരികയും ഇരട്ടസംഖ്യ കിട്ടുകയും ചെയ്യാനുള്ള സാധ്യത?','A coin is tossed and a die is rolled. Chance of a head and an even number?','ആകെ 2 × 6 = 12 ; (തല,2), (തല,4), (തല,6) → 3 → {3/12} = {1/4}','Total 2 × 6 = 12 ; (H,2), (H,4), (H,6) → 3 → {3/12} = {1/4}'],
 ['1 മുതൽ 200 വരെ സംഖ്യകളിൽനിന്ന് ഒന്നെടുത്താൽ അത് പൂർണ്ണവർഗ്ഗമാകാനുള്ള സാധ്യത ഭിന്നസംഖ്യയായും ശതമാനമായും എഴുതുക.','One number from 1 to 200. Write the chance of a perfect square as a fraction and a percentage.','1², 2², …, 14² (14² = 196) → 14 → {14/200} = {7/100} = 7%','1², 2², …, 14² (14² = 196) → 14 → {14/200} = {7/100} = 7%']]},
{id:'s3',h:['Step 3 – പരീക്ഷയ്ക്ക് തയ്യാറാകാം','Step 3 – Exam ready'],sub:['പരീക്ഷാരീതിയിലുള്ള ചോദ്യങ്ങൾ. 3, 4 സ്കോർ.','Exam-style questions. 3 and 4 marks.'],mk:0,qs:[
 ['(3 സ്കോർ) ഒരു കൊട്ടയിൽ 40 ഓറഞ്ചുണ്ട്, അതിൽ 8 എണ്ണം കേടാണ്. മറ്റൊരു കൊട്ടയിൽ 25 ഓറഞ്ച്, അതിൽ 5 കേട്. ഓരോ കൊട്ടയിൽനിന്നും ഒന്നു വീതമെടുത്താൽ (i) രണ്ടും നല്ലത് (ii) രണ്ടും കേട് (iii) ഒരെണ്ണമെങ്കിലും നല്ലത് – ഇവയുടെ സാധ്യത കണ്ടെത്തുക.','(3 marks) One basket has 40 oranges of which 8 are rotten; another has 25 oranges of which 5 are rotten. One orange from each basket. Find the chance that (i) both are good (ii) both are rotten (iii) at least one is good.','ആകെ ജോടികൾ 40 × 25 = 1000. നല്ലത്: 32, 20.<br>(i) 32 × 20 = 640 → {640/1000} = {16/25}.<br>(ii) 8 × 5 = 40 → {40/1000} = {1/25}.<br>(iii) 1 − {1/25} = {24/25}.','Total pairs 40 × 25 = 1000. Good: 32 and 20.<br>(i) 32 × 20 = 640 → {640/1000} = {16/25}.<br>(ii) 8 × 5 = 40 → {40/1000} = {1/25}.<br>(iii) 1 − {1/25} = {24/25}.'],
 ['(4 സ്കോർ) 10 A യിൽ 24 ആൺകുട്ടികളും 16 പെൺകുട്ടികളും, 10 B യിൽ 20 ആൺകുട്ടികളും 20 പെൺകുട്ടികളുമുണ്ട്. ഓരോ ക്ലാസിൽ നിന്നും ഒരാളെ തിരഞ്ഞെടുക്കുന്നു. (i) രണ്ടും പെൺകുട്ടികൾ (ii) രണ്ടും ആൺകുട്ടികൾ (iii) ഒരാൾ ആൺ, ഒരാൾ പെൺ (iv) ഒരാളെങ്കിലും പെൺകുട്ടി – സാധ്യത?','(4 marks) 10 A has 24 boys and 16 girls; 10 B has 20 boys and 20 girls. One student is chosen from each class. Chance of (i) both girls (ii) both boys (iii) one boy and one girl (iv) at least one girl?','ആകെ 40 × 40 = 1600.<br>(i) 16 × 20 = 320 → {320/1600} = {1/5}.<br>(ii) 24 × 20 = 480 → {480/1600} = {3/10}.<br>(iii) 24×20 + 16×20 = 480 + 320 = 800 → {1/2}.<br>(iv) 1 − {3/10} = {7/10}.<br>പരിശോധന: 320 + 480 + 800 = 1600 ✓','Total 40 × 40 = 1600.<br>(i) 16 × 20 = 320 → {320/1600} = {1/5}.<br>(ii) 24 × 20 = 480 → {480/1600} = {3/10}.<br>(iii) 24×20 + 16×20 = 480 + 320 = 800 → {1/2}.<br>(iv) 1 − {3/10} = {7/10}.<br>Check: 320 + 480 + 800 = 1600 ✓'],
 ['(3 സ്കോർ) 1, 2, 3, 4 അക്കങ്ങൾ ഉപയോഗിച്ച് (അക്കങ്ങൾ ആവർത്തിക്കാം) രണ്ടക്കസംഖ്യകളെഴുതുന്നു. ഒരു സംഖ്യയെടുത്താൽ (i) അക്കങ്ങളുടെ തുക 5 (ii) രണ്ടക്കങ്ങളും തുല്യം (iii) സംഖ്യ 30 ൽ കൂടുതൽ – സാധ്യത?','(3 marks) Two-digit numbers are written using digits 1, 2, 3, 4 (repetition allowed). One is taken. Chance that (i) digit sum is 5 (ii) both digits are equal (iii) the number is greater than 30?','ആകെ 4 × 4 = 16.<br>(i) 14, 23, 32, 41 → {4/16} = {1/4}.<br>(ii) 11, 22, 33, 44 → {1/4}.<br>(iii) 31–34, 41–44 → 8 → {8/16} = {1/2}.','Total 4 × 4 = 16.<br>(i) 14, 23, 32, 41 → {4/16} = {1/4}.<br>(ii) 11, 22, 33, 44 → {1/4}.<br>(iii) 31–34, 41–44 → 8 → {8/16} = {1/2}.'],
 ['(3 സ്കോർ) ചക്രം A യിൽ 1 മുതൽ 6 വരെയും ചക്രം B യിൽ 1 മുതൽ 4 വരെയും സംഖ്യകളുണ്ട്. രണ്ടും ഒരിക്കൽ വീതം കറക്കുമ്പോൾ (i) ഗുണനഫലം ഇരട്ടസംഖ്യ (ii) തുക 5 – സാധ്യത?','(3 marks) Wheel A is numbered 1 to 6 and wheel B 1 to 4. Each is spun once. Chance that (i) the product is even (ii) the sum is 5?','ആകെ 6 × 4 = 24.<br>(i) ഗുണനഫലം ഒറ്റ: 3 × 2 = 6. ഇരട്ട = 24 − 6 = 18 → {18/24} = {3/4}.<br>(ii) (1,4), (2,3), (3,2), (4,1) → {4/24} = {1/6}.','Total 6 × 4 = 24.<br>(i) Product odd: 3 × 2 = 6. Even = 24 − 6 = 18 → {18/24} = {3/4}.<br>(ii) (1,4), (2,3), (3,2), (4,1) → {4/24} = {1/6}.'],
 ['(3 സ്കോർ) 20 സെ.മീ വശമുള്ള സമചതുരബോർഡിൽ അതിനകത്ത് കൃത്യമായി ചേർന്നുള്ള ഒരു വൃത്തം വരച്ചിരിക്കുന്നു. കണ്ണടച്ച് കുത്തിട്ടാൽ (i) വൃത്തത്തിനകത്ത് (ii) വൃത്തത്തിനു പുറത്ത് – സാധ്യത? (π ≈ 3.14)','(3 marks) A square board of side 20 cm has a circle drawn exactly inside it. A dot is dropped blindly. Chance it lands (i) inside the circle (ii) outside the circle? (π ≈ 3.14)','വൃത്തത്തിന്റെ ആരം 10 സെ.മീ.<br>(i) {π × 10²/20²} = {π/4} ≈ 0.785.<br>(ii) 1 − {π/4} ≈ 1 − 0.785 = 0.215.','Radius of the circle is 10 cm.<br>(i) {π × 10²/20²} = {π/4} ≈ 0.785.<br>(ii) 1 − {π/4} ≈ 1 − 0.785 = 0.215.'],
 ['(3 സ്കോർ) സമഷഡ്ഭുജത്തിന്റെ കേന്ദ്രത്തെ മൂലകളുമായി യോജിപ്പിച്ച് 6 തുല്യ ത്രികോണങ്ങളാക്കി. അവയിൽ 4 എണ്ണത്തിന് ചായം പൂശി. ഹെക്സഗണിൽ കുത്തിട്ടാൽ ചായമുള്ള ഭാഗത്താകാനുള്ള സാധ്യത എത്ര? ഒന്നിടവിട്ട മൂലകൾ ചേർത്ത ത്രികോണത്തിനകത്താകാനുള്ള സാധ്യത എത്ര?','(3 marks) The centre of a regular hexagon is joined to its vertices making 6 equal triangles; 4 of them are painted. Chance a dot lands on the painted part? Chance it lands inside the triangle joining alternate vertices?','{4/6} = {2/3}.<br>ഒന്നിടവിട്ട മൂലകൾ ചേർത്ത ത്രികോണം ഷഡ്ഭുജത്തിന്റെ പകുതി → {1/2}.','{4/6} = {2/3}.<br>The triangle on alternate vertices is half of the hexagon → {1/2}.'],
 ['(3 സ്കോർ) തെറ്റ് കണ്ടെത്തുക: "രണ്ടു പകിട ഉരുട്ടുമ്പോൾ തുക 2 മുതൽ 12 വരെ 11 സാധ്യതകളുണ്ട്, അതിനാൽ തുക 12 കിട്ടാനുള്ള സാധ്യത {1/11}." ശരിയുത്തരം എഴുതുക. തുക 7 കിട്ടാനുള്ള സാധ്യതയും കണ്ടെത്തുക.','(3 marks) Find the error: "Two dice give sums 2 to 12, which is 11 possibilities, so the chance of sum 12 is {1/11}." Write the correct answer. Also find the chance of sum 7.','11 തുകകൾ ഉണ്ടെങ്കിലും എല്ലാറ്റിനും തുല്യസാധ്യതയില്ല. തുല്യസാധ്യതയുള്ളത് 6 × 6 = 36 ജോടികൾക്കാണ്.<br>തുക 12 → (6,6) മാത്രം → {1/36}.<br>തുക 7 → 6 ജോടികൾ → {6/36} = {1/6}.','Although there are 11 sums, they are not equally likely. The equally likely outcomes are the 6 × 6 = 36 pairs.<br>Sum 12 → only (6,6) → {1/36}.<br>Sum 7 → 6 pairs → {6/36} = {1/6}.'],
 ['(4 സ്കോർ) ഒരു പെട്ടിയിൽ 1 മുതൽ 12 വരെയും മറ്റൊരു പെട്ടിയിൽ 1 മുതൽ 4 വരെയും എഴുതിയ കടലാസുകളുണ്ട്. ഓരോന്നിൽ നിന്നും ഒന്നെടുത്താൽ (i) രണ്ടും ഒറ്റസംഖ്യ (ii) ഗുണനഫലം ഇരട്ടസംഖ്യ (iii) രണ്ടും ഒരേ സംഖ്യ – സാധ്യത?','(4 marks) One box has slips 1 to 12 and another 1 to 4. One slip from each. Chance that (i) both are odd (ii) the product is even (iii) both numbers are the same?','ആകെ 12 × 4 = 48.<br>(i) 6 × 2 = 12 → {12/48} = {1/4}.<br>(ii) ഗുണനഫലം ഒറ്റ = രണ്ടും ഒറ്റ = 12. ഇരട്ട = 48 − 12 = 36 → {36/48} = {3/4}.<br>(iii) (1,1), (2,2), (3,3), (4,4) → 4 → {4/48} = {1/12}.','Total 12 × 4 = 48.<br>(i) 6 × 2 = 12 → {12/48} = {1/4}.<br>(ii) Product odd = both odd = 12. Even = 48 − 12 = 36 → {36/48} = {3/4}.<br>(iii) (1,1), (2,2), (3,3), (4,4) → 4 → {4/48} = {1/12}.']]}
];
