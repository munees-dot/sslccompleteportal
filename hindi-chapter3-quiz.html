function isQuizOpen(){return true;}
function updateTimeNotice(){}

function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
let lookupSeq=0, savingResult=false;
$('#admissionNo').addEventListener('input',()=>{
  clearTimeout(lookupTimer); const seq=++lookupSeq; verifiedStudent=null;
  const val=$('#admissionNo').value.trim(), preview=$('#studentPreview');
  preview.className='rule';
  if(!val){preview.textContent='Enter your Admission Number.';return;}
  if(!/^\d+$/.test(val)){preview.textContent='Admission Number must contain digits only.';return;}
  preview.textContent='Searching student…';
  lookupTimer=setTimeout(async()=>{
    try {
      const {data,error}=await supabase.rpc('verify_student',{p_admission_no:Number(val)});
      if(seq!==lookupSeq || $('#admissionNo').value.trim()!==val)return;
      if(error){preview.textContent='Student lookup failed: '+error.message;return;}
      const st=Array.isArray(data)?data[0]:data;
      if(!st || st.admission_no==null){preview.textContent='Student not found. Check the Admission Number.';return;}
      verifiedStudent=st;
      preview.innerHTML='<strong>Student:</strong> '+escapeHtml(st.student_name)+'<br><strong>Class:</strong> '+escapeHtml(st.class||'—')+'<br><strong>Centre:</strong> '+escapeHtml(st.centre||'—');
    } catch(e) {
      if(seq===lookupSeq && $('#admissionNo').value.trim()===val) preview.textContent='Connection error: '+(e.message||'Please check your internet connection and try again.');
    }
  },300);
});
$('#verifyStart').addEventListener('click',async()=>{
  updateTimeNotice();
  if(!isQuizOpen()){renderClosed();return;}
  const val=$('#admissionNo').value.trim(), btn=$('#verifyStart'), preview=$('#studentPreview');
  if(!val){preview.textContent='Please enter Admission Number.';return;}
  if(!/^\d+$/.test(val)){preview.textContent='Admission Number must contain digits only.';return;}
  btn.disabled=true; preview.textContent='Verifying student…';
  try{
    let st=verifiedStudent;
    if(!st || String(st.admission_no)!==String(val)){
      const result=await supabase.rpc('verify_student',{p_admission_no:Number(val)});
      if(result.error)throw new Error(result.error.message);
      st=Array.isArray(result.data)?result.data[0]:result.data;
    }
    if(!st || st.admission_no==null)throw new Error('Admission Number not found.');
    verifiedStudent=st; submitted=false; savingResult=false;
    $('#studentCard').innerHTML='<h2>Verified Student</h2><p><strong>'+escapeHtml(st.student_name)+'</strong></p><p>Admission No: '+escapeHtml(st.admission_no)+' · Class: '+escapeHtml(st.class||'—')+' · Centre: '+escapeHtml(st.centre||'—')+'</p><p class="mut">Quiz started. Your result will be saved automatically.</p>';
    i=0;sc=0;an=[];K=build();show();

  if(submitted || savingResult || !verifiedStudent)return;
  savingResult=true;
  const answers=K.map((k,n)=>({question_no:n+1,selected_answer:an[n]===undefined?null:String(k.o[an[n]]),correct_answer:String(k.o[k.a]),is_correct:an[n]===k.a}));
  const note=document.createElement('div');note.className='rule';note.textContent='Saving your result…';$('#qb').appendChild(note);
  try{
    const {data,error}=await supabase.rpc('submit_quiz',{
      p_admission_no:Number(verifiedStudent.admission_no),
      p_subject:QUIZ_SUBJECT,
      p_chapter:QUIZ_CHAPTER,
      p_quiz_name:QUIZ_NAME,
      p_score:sc,
      p_total:20,
      p_percentage:Number((sc/20*100).toFixed(2)),
      p_answers:answers
    });
    if(error)throw new Error(error.message);
    if(data && data.error)throw new Error(data.error);
    submitted=true;
    note.textContent='Result saved successfully.';
  }catch(e){
    note.textContent='Result could not be saved: '+(e.message||e)+'. Please contact your teacher; do not retake unless instructed.';
    const retry=document.createElement('button');retry.className='btn';retry.textContent='Retry saving result';retry.onclick=()=>{savingResult=false;note.remove();saveQuizResult();};
    const row=document.createElement('div');row.className='row';row.appendChild(retry);$('#qb').appendChild(row);
  }finally{savingResult=false;}
}
const originalShow=show;
show=function(){
  if(!verifiedStudent){$('#qb').innerHTML='<p>Verify your Admission Number to begin the quiz.</p>';return;}
  if(!isQuizOpen()){renderClosed();return;}
  originalShow();
  if(i>=20)saveQuizResult();
};
updateTimeNotice();

</script></body></html>
